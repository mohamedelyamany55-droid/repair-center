<title>متابعة المركز</title>
<style>
/* Layout: job-ticket cards on a cool bench-grey ground, bottom tab bar on phones, bottom-sheet forms. */
:root{
  --bg:#E8EDEB; --surface:#FFFFFF; --surface2:#F2F5F4; --ink:#18221F;
  --muted:#586A65; --line:#D2DAD7; --accent:#0D6A57; --accent-ink:#FFFFFF; --accent-soft:#D4EBE4;
  --good:#1B7F45; --good-bg:#DBF0E3; --warn:#8F5A06; --warn-bg:#FAE9C8; --crit:#B3302A; --crit-bg:#F8D9D5;
  --info:#27609F; --info-bg:#DAE7F5; --neutral:#4D5E5A; --neutral-bg:#E2E8E6;
  --shadow:0 -6px 24px rgba(20,34,30,.14);
  --f-display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111917; --surface:#19231F; --surface2:#202C28; --ink:#E3ECE8; --muted:#97AAA4; --line:#2D3C37;
    --accent:#4CC7A4; --accent-ink:#08201A; --accent-soft:#1B3A31;
    --good:#58D08A; --good-bg:#1B3A29; --warn:#E9B552; --warn-bg:#3D2F12; --crit:#F08177; --crit-bg:#432120;
    --info:#7DB2EE; --info-bg:#1B2F47; --neutral:#A9BAB5; --neutral-bg:#26332F;
    --shadow:0 -6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#19231F; --surface2:#202C28; --ink:#E3ECE8; --muted:#97AAA4; --line:#2D3C37;
  --accent:#4CC7A4; --accent-ink:#08201A; --accent-soft:#1B3A31;
  --good:#58D08A; --good-bg:#1B3A29; --warn:#E9B552; --warn-bg:#3D2F12; --crit:#F08177; --crit-bg:#432120;
  --info:#7DB2EE; --info-bg:#1B2F47; --neutral:#A9BAB5; --neutral-bg:#26332F;
  --shadow:0 -6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;display:inline-block}

#app{max-width:760px;margin-inline:auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:0}
.ver{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 8px}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner b{font-weight:600}
.banner .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.banner .links button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}

.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--crit-bg);color:var(--crit)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:thin}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;margin-inline-start:5px;opacity:.8}

.list{display:grid;gap:10px}
.card{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.card .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 7px;direction:ltr}
.cust{font-weight:600;font-size:16px;margin-top:6px}
.sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.meta .price{margin-inline-start:auto;color:var(--ink);font-weight:600}
.stale{margin-top:8px;font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:2px 8px;display:inline-block}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st-wait{background:var(--neutral-bg);color:var(--neutral)}
.st-check{background:var(--info-bg);color:var(--info)}
.st-part{background:var(--warn-bg);color:var(--warn)}
.st-ready{background:var(--good-bg);color:var(--good)}
.st-hold{background:var(--crit-bg);color:var(--crit)}
.st-done{background:transparent;color:var(--muted);border:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.rows{display:grid;gap:0}
.rows .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rows .row:last-child{border-bottom:0}
.rows .row.total{font-weight:600;font-size:17px}
.good{color:var(--good)} .crit{color:var(--crit)} .muted{color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg .chip{flex:1;text-align:center}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{min-width:0;flex:1}
.item .t b{font-weight:600;overflow-wrap:anywhere}
.item .t div{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:18px;cursor:pointer}
.qty .n{font-family:var(--f-mono);min-width:26px;text-align:center;font-weight:500}
.qual{font-size:12px;border-radius:6px;padding:0 7px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.low{color:var(--crit)}

form,.form{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;color:var(--ink);min-width:0;width:100%}
label.f textarea{min-height:70px;resize:vertical}
label.chk{display:flex;align-items:center;gap:8px;font-size:15px}
label.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}

.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.nav-in{display:flex;width:100%;max-width:760px}
.tab{flex:1;background:none;border:0;padding:9px 4px 8px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:600}

.veil{position:fixed;inset:0;z-index:40;background:rgba(10,18,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-block:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:18px;max-height:90%}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.x{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.toast{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:14px;max-width:90%}
.local{background:var(--crit-bg);color:var(--crit);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.mw{position:relative;display:block}
.mw input,.mw textarea{padding-inline-end:42px}
.mw input[dir=ltr]{padding-inline-end:10px;padding-inline-start:42px}
.mic{position:absolute;inset-inline-end:4px;top:4px;width:32px;height:32px;border-radius:8px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.mic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--crit);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:micpulse 1s ease-in-out infinite}@keyframes micpulse{50%{opacity:.6}}}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
#login{background:var(--bg)}
.loginwrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.loginwrap .box{width:100%;max-width:380px;margin:0}
.top .right{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.card,.chip,.btn{transition:background .12s,border-color .12s}}

/* v1.4: responsive. Phones keep the exact same layout; wide screens (computer) use the full width. */
@media (min-width:900px){
  #app{max-width:1280px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  .nav-in{max-width:1280px}
  .list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  #view .box{max-width:none}
  .sheet{max-width:720px}
  #settingsBox,#report,#balance,#exps,#losses{max-width:900px;margin-inline:auto}
}
@media (min-width:1400px){
  #app{max-width:1500px}
  .nav-in{max-width:1500px}
}

/* v1.5: priority, urgent tag, filter bar, customer receipt */
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;color:var(--ink);max-width:100%}
.card.p-high{border-inline-start:6px solid var(--crit)}
.card.p-mid{border-inline-start:6px solid var(--warn)}
.card.p-low{border-inline-start:6px solid var(--line)}
.bdg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill.urgent{background:var(--crit);color:var(--surface)}
.pri{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.pri.pri-high{border-color:var(--crit);color:var(--crit)}
.pri.pri-mid{border-color:var(--warn);color:var(--warn)}
.receipt{--ink:#18221F;--line:#D2DAD7;--muted:#586A65;background:#fff;color:#18221F;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.receipt .rh{text-align:center;border-bottom:2px solid #18221F;padding-bottom:10px;margin-bottom:10px}
.receipt .rh b{display:block;font-family:var(--f-display);font-size:22px}
.receipt .rh span{font-size:13px;color:var(--muted)}
.receipt .rfoot{text-align:center;font-size:13px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.receipt .rows .row.total{border-top:2px solid #18221F}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.rbtns .btn{flex:1}
@media print{
  body>*:not(#modal){display:none!important}
  body{background:#fff}
  #modal .veil{position:static;background:none;display:block}
  #modal .sheet{box-shadow:none;max-width:none;max-height:none;overflow:visible;padding:0;background:#fff;border-radius:0}
  .noprint{display:none!important}
  .receipt{border:0;padding:0}
}

/* v1.6 */
details.sec>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:18px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▾';float:inline-end;color:var(--muted)}
details.sec[open]>summary{margin-bottom:10px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.stat b{font-size:22px;font-family:var(--f-mono);direction:ltr;text-align:start}
.stat span{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
a.btn{text-decoration:none;display:inline-block}
</style>

<script>
(function(){
document.documentElement.lang='ar'; document.documentElement.dir='rtl';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);

const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const nowTime=()=>{const n=new Date();return `${pad(n.getHours())}:${pad(n.getMinutes())}`};
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dshow=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${+d}/${+m}/${y}`};
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
function devicesWord(n){return n===1?'جهاز واحد':n===2?'جهازان':n<=10?`${n} أجهزة`:`${n} جهاز`}

const ST=[
 {k:'wait',l:'في الانتظار',c:'st-wait'},

 {k:'done',l:'تم التسليم',c:'st-done'}
];

let session=null, pollT=null, isAdmin=false, refreshing=null, busy=0;

/* a visible error box, so a script problem never ends as a silent white page */
let errShown=false;
function showErr(m){
  if(errShown)return; errShown=true;
  const d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#B3302A;color:#fff;padding:8px 12px;font:13px sans-serif;direction:ltr;cursor:pointer';

const SS={
  get(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null') }catch(e){ return null } },
  set(v){ try{ if(v)localStorage.setItem(SESSION_KEY,JSON.stringify(v)); else localStorage.removeItem(SESSION_KEY) }catch(e){} }
};

const stripId=o=>{const {id,...rest}=o||{};return rest};

/* ---------- http ---------- */
async function http(path,opt){
  const {method='GET',body,auth=true,headers={}}=opt||{};
  const h={apikey:SB_KEY,...headers};
  if(body!==undefined)h['Content-Type']='application/json';
  if(auth){
    const t=await accessToken();
    if(!t){const e=new Error('not signed in');e.code='no_session';throw e}
    h.Authorization='Bearer '+t;
  }
  let res;
  try{ res=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)}); }
  catch(err){ const e=new Error('network: '+((err&&err.message)||'failed to fetch')); e.code='network'; throw e; }
  const text=await res.text(); let json=null; try{ json=text?JSON.parse(text):null }catch(e){}
  if(!res.ok){
    const e=new Error((json&&(json.message||json.msg||json.error_description||json.error))||('HTTP '+res.status));
    e.code=String((json&&(json.error_code||json.code))||res.status); e.status=res.status; throw e;
  }
  return json;
}
function setSession(r){
  if(!r){ session=null; SS.set(null); return; }
  const now=Math.floor(Date.now()/1000);
  session={access_token:r.access_token,refresh_token:r.refresh_token,
    expires_at:r.expires_at||(now+(Number(r.expires_in)||3600)),
    user:(r.user&&{id:r.user.id,email:r.user.email})||(session&&session.user)||{}};
  SS.set(session);
}
async function accessToken(){
  if(!session)return null;
  const now=Math.floor(Date.now()/1000);
  if(session.expires_at&&session.expires_at-now>60)return session.access_token;
  if(!refreshing){
    refreshing=(async()=>{
      try{
        const r=await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:session.refresh_token}});
        setSession(r);
      }catch(e){
        if(e.code!=='network'){ setSession(null); handleSignedOut('انتهت الجلسة، سجّل دخول تاني'); }
        throw e;
      }finally{ refreshing=null; }
    })();
  }
  try{ await refreshing; }catch(e){ if(e.code==='network'&&session&&session.access_token)return session.access_token; return null; }
  return session&&session.access_token;
}

/* ---------- cache ---------- */
function applyRow(r){
  if(!r||!cache[r.collection])return;
  const doc={...(r.data||{}),id:r.id};
  const i=cache[r.collection].findIndex(x=>x.id===r.id);
  if(i<0)cache[r.collection].push(doc); else cache[r.collection][i]=doc;
}
function dropRow(col,id){ if(cache[col])cache[col]=cache[col].filter(x=>x.id!==id); }

/* ---------- writes (same names the app already uses) ---------- */
async function put(col,id,data){
  busy++;
  try{
    await http('/rest/v1/docs?on_conflict=collection,id',{method:'POST',body:{collection:col,id,data},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
    applyRow({collection:col,id,data}); renderData();
  }finally{busy--}
}
async function patch(col,id,data){
  busy++;
  try{
    await http('/rest/v1/rpc/patch_doc',{method:'POST',body:{p_collection:col,p_id:id,p_patch:data}});
    const cur=cache[col].find(x=>x.id===id);
    applyRow({collection:col,id,data:{...stripId(cur),...data}}); renderData();
  }finally{busy--}
}
async function remove(col,id){
  busy++;
  try{
    const rows=await http('/rest/v1/docs?collection=eq.'+encodeURIComponent(col)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=representation'}});
    if(!rows||!rows.length){const e=new Error('not allowed');e.code='42501';throw e}
    dropRow(col,id); renderData();
  }finally{busy--}
}
async function safe(fn){
  try{ await fn(); return true; }
  catch(e){
    const c=e&&e.code, m=String((e&&e.message)||'');
    toast(c==='42501'||c==='401'||c==='403'||/not allowed|row-level/i.test(m)?'مفيش صلاحية للعملية دي على الحساب ده'
      :c==='network'?'مفيش اتصال بالنت، جرب تاني'
      :'الحفظ ماتمش، جرب تاني');
    console.warn(e);
    return false;
  }
}

function setBar(msg){ const b=$('#localbar'); if(b)b.innerHTML=msg?`<div class="local">${esc(msg)}</div>`:''; }
async function loadAll(){
  if(!session||busy>0)return;
  let all=[],off=0;
  try{
    for(;;){
      const rows=await http('/rest/v1/docs?select=collection,id,data&order=collection.asc,id.asc&limit=1000&offset='+off);
      all=all.concat(rows||[]); if(!rows||rows.length<1000)break; off+=1000;
    }
  }catch(e){
    if(e.code==='no_session')return;
    setBar(e.code==='network'?'مفيش اتصال بالنت. البيانات اللي قدامك ممكن تكون قديمة.':'مش قادر أحمّل البيانات. اتأكد إن كود الإعداد اتنفذ في Supabase.');
    console.warn(e); return;
  }
  if(busy>0)return;
  setBar('');

}

async function doLogin(e){

  const email=$('#l-email').value.trim().toLowerCase(), password=$('#l-pass').value;
  if(!email||!password)return;

  const fail=m=>{err.textContent=m;btn.disabled=false;btn.textContent='دخول'};
  try{
    const r=await http('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}});
    setSession(r); await startApp();
  }catch(ex){
    console.warn(ex);
    fail(ex.code==='network'?'مقدرتش أتصل بقاعدة البيانات. اتأكد من النت وجرب تاني.'
      :ex.code==='email_not_confirmed'?'الحساب ده لسه مش مفعّل في Supabase.'
      :(ex.code==='invalid_credentials'||ex.status===400||ex.status===401)?'الإيميل أو الباسورد غلط'
      :'حصلت مشكلة ('+(ex.message||ex.code)+')');
  }
}
async function startApp(){

    try{

      catch(ex){ if(ex.code==='network')throw ex; toast('الباسورد الحالي غلط'); return; }

const priHigh=()=>{const n=Number(settings().priHigh);return n>0?n:500};
const priMid=()=>{const n=Number(settings().priMid);return n>0?n:200};
const teamNames=()=>settings().team||[];
const devs=()=>cache.devices;
const partCost=d=>(d.parts||[]).reduce((s,p)=>s+num(p.price)+num(p.shipping),0);
/* a part is deducted from profit on the day it was logged (older parts without a date fall back to the device's dates) */
const partDate=(p,d)=>p.date||d.deliveredAt||(d.createdAt?iso(new Date(d.createdAt)):(d.entryDate||''));
const partsLoggedIn=(R)=>devs().reduce((s,d)=>s+(d.parts||[]).filter(p=>{const x=partDate(p,d);return x&&x>=R.from&&x<=R.to}).reduce((a,p)=>a+num(p.price)+num(p.shipping),0),0);
const paidOf=d=>(d.payments||[]).reduce((s,p)=>s+num(p.amount),0);
const linkedLoss=d=>cache.losses.filter(l=>l.deviceId===d.id).reduce((s,l)=>s+num(l.amount),0);
function isStale(d){ if(d.status==='done')return false; const t=d.statusAt||d.createdAt||0; return t&&(Date.now()-t)/864e5>=alertDays(); }
function staleDays(d){return Math.floor((Date.now()-(d.statusAt||d.createdAt||Date.now()))/864e5)}

function suppliers(){ const s=new Set(); devs().forEach(d=>(d.parts||[]).forEach(p=>p.supplier&&s.add(p.supplier))); cache.inventory.forEach(i=>i.supplier&&s.add(i.supplier)); return [...s]; }

const expProfit=d=>num(d.price)-partCost(d);
function priLevel(d){const p=expProfit(d);return p>=priHigh()?'high':p>=priMid()?'mid':'low'}
const PRI_LABEL={high:'أولوية عالية',mid:'أولوية متوسطة',low:'أولوية عادية'};
function renderFbar(){
  const el=$('#fbar'); if(!el)return;
  const techs=[...new Set([...teamNames(),...devs().map(d=>d.tech).filter(Boolean)])];
  const sig=JSON.stringify([techs,S.sort,S.tech]);

function filtered(){
  const q=S.q.trim().toLowerCase();
  return devs().filter(d=>{
    if(S.tech&&d.tech!==S.tech)return false;
    if(S.filter==='stale'&&!isStale(d))return false;
    if(S.filter!=='all'&&S.filter!=='stale'&&d.status!==S.filter)return false;
    if(!q)return true;
    return [d.customer,d.phone,d.model,d.imei,d.issue,String(d.no||'')].some(x=>String(x||'').toLowerCase().includes(q));
  }).sort((a,b)=>{
    const dn=(a.status==='done')-(b.status==='done'); if(dn)return dn;
    if(S.sort==='prio'){
      const u=(b.urgent?1:0)-(a.urgent?1:0); if(u)return u;
      const pr=expProfit(b)-expProfit(a); if(pr)return pr;
    }
    return (b.createdAt||0)-(a.createdAt||0);
  });

  showModal(html);
  $('#devform').addEventListener('submit',e=>{e.preventDefault();saveDevice();});

async function saveDevice(){
  const g=i=>$('#'+i).value.trim();

  if(!base.customer){toast('اكتب اسم العميل');return}
  const id=S.modal.id;
  if(id){
    if(await safe(()=>patch('devices',id,base))){toast('اتحفظ');}
  }else{
    const no=devs().reduce((m,d)=>Math.max(m,d.no||0),0)+1;

  }
}

/* ----- customer receipt (never shows part costs or profit) ----- */
function receiptData(d){
  const st=settings(), paid=paidOf(d), price=num(d.price);
  const w=d.warranty||{}; let wtxt='';
  if(w.on&&w.months){
    const ws=w.start||d.deliveredAt||'';
    if(ws){const e=parse(ws);e.setMonth(e.getMonth()+Number(w.months));wtxt=`${w.months} شهر، ينتهي ${dshow(iso(e))}`}
    else wtxt=`${w.months} شهر من تاريخ التسليم`;
  }
  return {center:st.centerName||'مركز الصيانة',cphone:st.centerPhone||'',no:'#'+String(d.no||0).padStart(4,'0'),
    customer:d.customer||'',phone:d.phone||'',model:d.model||'',issue:d.issue||'',entry:d.entryDate||'',delivered:d.deliveredAt||'',
    price,paid,left:price-paid,wtxt};
}
function openReceipt(id){
  const d=devs().find(x=>x.id===id); if(!d)return;
  const r=receiptData(d);
  S.modal={type:'receipt',id};
  const row=(l,v)=>v?`<div class="row"><span>${l}</span><span>${v}</span></div>`:'';
  showModal(`<div class="sheet" role="dialog" aria-modal="true"><div class="hd noprint"><h2>إيصال للعميل</h2><button class="x" data-act="close-receipt" aria-label="رجوع">✕</button></div>
   <div class="receipt" dir="rtl"><div class="rh"><b>${esc(r.center)}</b>${r.cphone?`<span class="num">${esc(r.cphone)}</span>`:''}</div>
    <div class="rows">
     ${row('رقم الإيصال',`<span class="mono">${esc(r.no)}</span>`)}
     ${row('التاريخ',dshow(today()))}
     ${row('العميل',esc(r.customer))}
     ${row('التليفون',r.phone?`<span class="num">${esc(r.phone)}</span>`:'')}
     ${row('الجهاز',esc(r.model))}
     ${row('العطل',esc(r.issue))}
     ${row('تاريخ الاستلام',r.entry?dshow(r.entry):'')}

     ${row('الضمان',esc(r.wtxt))}

   <div class="rbtns noprint"><button class="btn" data-act="print-receipt">طباعة</button><button class="btn soft" data-act="share-receipt">مشاركة / نسخ</button></div></div>`);

async function shareReceipt(){
  const d=devs().find(x=>x.id===(S.modal&&S.modal.id)); if(!d)return;
  const r=receiptData(d);
  const lines=[r.center+(r.cphone?' - '+r.cphone:''),'إيصال '+r.no+' - '+dshow(today()),'العميل: '+r.customer,
    r.model?'الجهاز: '+r.model:'',r.issue?'العطل: '+r.issue:'',r.wtxt?'الضمان: '+r.wtxt:'',
    'المبلغ: '+fmt(r.price)+' ج','المدفوع: '+fmt(r.paid)+' ج','المتبقي: '+fmt(Math.max(0,r.left))+' ج','شكرًا لثقتكم'].filter(Boolean);
  const text=lines.join('\n');
  try{
    if(navigator.share){await navigator.share({title:'إيصال '+r.no,text});return}
    await navigator.clipboard.writeText(text); toast('اتنسخ نص الإيصال');
  }catch(e){ if(e&&e.name!=='AbortError')toast('مقدرتش أشارك، جرب الطباعة'); }
}

function renderStock(){
  const q=($('#sq')&&$('#sq').value||'').trim().toLowerCase();
  const catSel=S.cat||'all';
  const items=cache.inventory;
  const cats=['all',...CATS.filter(c=>items.some(i=>i.category===c))];
  $('#cchips').innerHTML=cats.map(c=>`<button class="chip ${catSel===c?'on':''}" data-cat="${esc(c)}">${c==='all'?'الكل':esc(c)}</button>`).join('');
  const value=items.reduce((s,i)=>s+num(i.qty)*num(i.buyPrice),0);
  const pieces=items.reduce((s,i)=>s+num(i.qty),0);
  $('#stocksum').innerHTML=items.length?`<div class="box"><div class="rows"><div class="row"><span>عدد القطع المتاحة</span><span class="num">${fmt(pieces)}</span></div><div class="row"><span>قيمة المخزون بسعر الشراء</span><span>${money(value)}</span></div></div></div>`:'';

    .sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''),'ar')||String(a.name||'').localeCompare(String(b.name||''),'ar'));
  $('#stocklist').innerHTML=l.length?l.map(i=>`<div class="item"><button class="t" data-act="open-item" data-id="${esc(i.id)}" style="background:none;border:0;text-align:start;padding:0;cursor:pointer"><b>${esc(i.name)}</b> <span class="qual">${esc(i.quality||'غير محدد')}</span><div>${esc(i.category||'')}${i.model?' · '+esc(i.model):''}${i.supplier?' · '+esc(i.supplier):''} · ${money(i.buyPrice)}</div></button>
    <div class="qty"><button data-act="qty-minus" data-id="${esc(i.id)}" aria-label="نقص">−</button><span class="n ${num(i.qty)<=0?'low':''}">${num(i.qty)}</span><button data-act="qty-plus" data-id="${esc(i.id)}" aria-label="زوّد">+</button></div></div>`).join(''):
   `<div class="empty" style="border:0"><b>${items.length?'مفيش نتايج':'المخزون فاضي'}</b>${items.length?'جرب كلمة تانية.':'ضيف أي قطعة غيار عندك (شاشات، آي سيهات، فلاتات، هاوسنج...) عشان تعرف قبل ما تشتري إنها موجودة.'}</div>`;

function range(){
  const r=S.ref;
  if(S.period==='day')return {from:r,to:r,label:`اليوم ${dshow(r)}`};
  if(S.period==='week'){const back=(parse(r).getDay()+1)%7;const f=addDays(r,-back);const t=addDays(f,6);return {from:f,to:t,label:`الأسبوع من ${dshow(f)} إلى ${dshow(t)}`}}
  const d=parse(r);const f=iso(new Date(d.getFullYear(),d.getMonth(),1));const t=iso(new Date(d.getFullYear(),d.getMonth()+1,0));
  return {from:f,to:t,label:`شهر ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
}

/* ---------- per-field voice input (a mic next to each field) ---------- */
const MIC_SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC_WORDS={'صفر':'0','زيرو':'0','zero':'0','واحد':'1','واحدة':'1','one':'1','اتنين':'2','اثنين':'2','إثنين':'2','two':'2','تلاتة':'3','ثلاثة':'3','تلات':'3','three':'3','اربعة':'4','أربعة':'4','أربع':'4','four':'4','خمسة':'5','خمس':'5','five':'5','ستة':'6','ست':'6','six':'6','سبعة':'7','سبع':'7','seven':'7','تمانية':'8','ثمانية':'8','تمن':'8','eight':'8','تسعة':'9','تسع':'9','nine':'9'};
function micDigits(t){return t.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c))}
function micValue(el,raw){
  let t=micDigits(String(raw||'').trim());
  if(el.type==='tel'||el.type==='number'||el.inputMode==='numeric'||el.inputMode==='decimal'){
    t=t.split(/\s+/).map(w=>{const k=w.toLowerCase();return Object.prototype.hasOwnProperty.call(MIC_WORDS,k)?MIC_WORDS[k]:w}).join(' ');
    t=t.replace(/(?<=\d)\s+(?=\d)/g,'').replace(/[^\d.\-]/g,'');
  }
  return t;
}
let micActive=null;
function stopMic(){ if(micActive){try{micActive.rec.stop()}catch(e){} micActive=null} document.querySelectorAll('.mic.on').forEach(b=>b.classList.remove('on')); }
function startMic(btn){
  const el=btn.previousElementSibling; if(!el||!MIC_SR)return;
  if(micActive&&micActive.btn===btn){stopMic();return}
  stopMic();
  const rec=new MIC_SR(); rec.lang='ar-EG'; rec.interimResults=false; rec.maxAlternatives=1;
  micActive={rec,btn}; btn.classList.add('on');
  rec.onresult=ev=>{
    const txt=micValue(el,Array.from(ev.results).map(r=>r[0].transcript).join(' '));
    if(!txt)return;
    el.value=(el.tagName==='TEXTAREA'&&el.value?el.value+' ':'')+txt;
    el.dispatchEvent(new Event('input',{bubbles:true}));
  };
  rec.onerror=ev=>{ stopMic(); toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'اسمح للمتصفح باستخدام المايك':'مسمعتش كويس، جرب تاني'); };
  rec.onend=()=>{ if(micActive&&micActive.btn===btn)stopMic(); };
  try{rec.start()}catch(e){stopMic()}
}
function attachMics(){
  if(!MIC_SR)return;
  ['f-customer','f-phone','f-model','f-imei','f-issue','f-receiver','f-tech','f-due','f-price','f-notes','p-name','p-sup','p-price','p-ship','y-amt','y-by'].forEach(k=>{

    w.appendChild(b);

}

document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){S.tab=tab.dataset.tab;renderTab();return}
  const so=e.target.closest('[data-sort]'); if(so){S.sort=so.dataset.sort;renderFbar();renderDevList();return}
  const fl=e.target.closest('[data-filter]'); if(fl){S.filter=fl.dataset.filter;renderChips();renderDevList();return}

  const pr=e.target.closest('[data-period]'); if(pr){S.period=pr.dataset.period;renderMoney();return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='veil'){ if(e.target===b)closeModal(); return }
  if(act==='close')return closeModal();
  if(act==='new-dev')return openDevice(null);
  if(act==='open-dev')return openDevice(id);
  if(act==='new-item')return openItem(null);
  if(act==='open-item')return openItem(id);
  if(act==='new-exp')return openExpense();
  if(act==='new-loss')return openLoss();
  if(act==='print-receipt'){window.print();return}
  if(act==='share-receipt')return shareReceipt();
  if(act==='close-receipt'){const rid=S.modal&&S.modal.id; if(rid)openDevice(rid); else closeModal(); return}
  const d=curDev();
  if(act==='receipt'&&d)return openReceipt(d.id);
  if(act==='set-status'&&d){
    const k=b.dataset.k; if(k===d.status)return;
    const data={status:k,statusAt:Date.now(),deliveredAt:k==='done'?today():''};
    await devPatch(d.id,data); return;
  }
  if(act==='add-part'&&d){
    const name=$('#p-name').value.trim(); if(!name){toast('اكتب اسم القطعة');return}
    const part={id:'p'+Date.now().toString(36),name,supplier:$('#p-sup').value.trim(),price:num($('#p-price').value),shipping:num($('#p-ship').value),date:today(),sw:num($('#p-sw').value)};
    const bk=['p-name','p-sup','p-price','p-ship','p-sw'].map(k=>[k,$('#'+k).value]);
    bk.forEach(([k])=>{$('#'+k).value=''});   /* clear first so a live refresh can't bring the old text back */
    const ok=await devPatch(d.id,{parts:[...(d.parts||[]),part]});
    if(!ok)bk.forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v});
    return;
  }
  if(act==='add-stock-part'&&d){
    const it=cache.inventory.find(x=>x.id===$('#p-stock').value);
    if(!it||num(it.qty)<1){toast('القطعة دي خلصت من المخزون');return}
    const part={id:'p'+Date.now().toString(36),name:it.name+(it.model?' - '+it.model:''),supplier:it.supplier||'',price:num(it.buyPrice),shipping:0,stockId:it.id,fromStock:true,date:today()};
    if(await devPatch(d.id,{parts:[...(d.parts||[]),part]})) await safe(()=>patch('inventory',it.id,{qty:num(it.qty)-1}));
    return;
  }
  if(act==='del-part'&&d){
    armConfirm(b,async()=>{
      const p=(d.parts||[]).find(x=>x.id===b.dataset.pid);
      if(await devPatch(d.id,{parts:(d.parts||[]).filter(x=>x.id!==b.dataset.pid)})&&p&&p.stockId){
        const it=cache.inventory.find(x=>x.id===p.stockId); if(it)await safe(()=>patch('inventory',it.id,{qty:num(it.qty)+1}));
      }
    });return;
  }
  if(act==='add-pay'&&d){
    const amt=num($('#y-amt').value); if(amt<=0){toast('اكتب المبلغ');return}
    const pay={id:'y'+Date.now().toString(36),amount:amt,method:$('#y-method').value,receivedBy:$('#y-by').value.trim(),holder:$('#y-holder').value.trim()||DRAWER,date:today()};
    const fullyPaid=num(d.price)>0&&paidOf(d)+amt>=num(d.price);
    const autoDeliver=fullyPaid&&(d.status==='ready'||d.status==='hold');
    const data={payments:[...(d.payments||[]),pay]};
    if(autoDeliver){data.status='done';data.statusAt=Date.now();data.deliveredAt=today();}
    if(await devPatch(d.id,data)){
      if(autoDeliver)toast('اتسجلت الدفعة والجهاز اتنقل لتم التسليم');
      else if(fullyPaid&&d.status!=='done')toast('الدفع كامل. لما العميل يستلم دوس "تم التسليم"');
    }
    return;
  }
  if(act==='deliver'){
    const dv=devs().find(x=>x.id===(id||(d&&d.id))); if(!dv||dv.status==='done')return;
    const left=num(dv.price)-paidOf(dv);
    const run=async()=>{ if(await devPatch(dv.id,{status:'done',statusAt:Date.now(),deliveredAt:today()}))toast('تم التسليم ✓'); };
    const msgs=[]; if(left>0)msgs.push('لسه على العميل '+fmt(left)+' ج'); if(!(dv.qc&&dv.qc.ok))msgs.push('الجهاز لسه ماعدّاش فحص الجودة');
    if(msgs.length){ armConfirm(b,run); toast(msgs.join(' و ')+'. اضغط تاني لو هتسلمه'); return; }
    return run();
  }
  if(act==='del-pay'&&d){armConfirm(b,()=>devPatch(d.id,{payments:(d.payments||[]).filter(x=>x.id!==b.dataset.pid)}));return}
  if(act==='del-dev'&&d){armConfirm(b,async()=>{if(await safe(()=>remove('devices',d.id))){closeModal();toast('اتحذف الجهاز')}});return}
  if(act==='qty-minus'||act==='qty-plus'){
    const it=cache.inventory.find(x=>x.id===id); if(!it)return;
    const q=Math.max(0,num(it.qty)+(act==='qty-plus'?1:-1)); if(q===num(it.qty))return;
    await safe(()=>patch('inventory',id,{qty:q})); return;
  }
  if(act==='del-item'){
    const itId=S.modal&&S.modal.id; armConfirm(b,async()=>{if(await safe(()=>remove('inventory',itId))){closeModal();toast('اتحذفت')}});return;
  }
  if(act==='del-exp'){armConfirm(b,()=>safe(()=>remove('expenses',id)));return}
  if(act==='del-loss'){armConfirm(b,()=>safe(()=>remove('losses',id)));return}
  if(act==='handover'){
    const from=b.dataset.h,to=b.dataset.to;
    for(const dv of devs()){
      if((dv.payments||[]).some(p=>(p.holder||DRAWER)===from)){
        await devPatch(dv.id,{payments:dv.payments.map(p=>(p.holder||DRAWER)===from?{...p,holder:to}:p)});
      }
    }
    toast('اتنقلت العهدة'); return;
  }
});

/* Extra records live as single docs inside the existing "settings" collection (ids: payroll, debts, tools, kb),
   so no new database table or permission is needed. */
const sdoc=id=>cache.settings.find(x=>x.id===id)||{};
const slist=(id,k)=>sdoc(id)[k]||[];
const ssave=(id,data)=>safe(()=>put('settings',id,data));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
S.open=S.open||{}; S.kbq=S.kbq||'';
document.addEventListener('toggle',e=>{const t=e.target; if(t&&t.dataset&&t.dataset.k)S.open[t.dataset.k]=t.open},true);
const secBox=(k,title,inner)=>`<details class="box sec" data-k="${k}" ${S.open[k]?'open':''}><summary>${title}</summary>${inner}</details>`;
const sheetHtml=(title,body)=>`<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h2>${title}</h2><button class="x" data-act="close" aria-label="إغلاق">✕</button></div>${body}</div>`;
const digits=s=>String(s||'').replace(/\D/g,'');
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const daysAgo=s=>Math.floor((parse(today())-parse(s))/864e5);
function waLink(phone,text){
  let p=digits(phone); if(!p)return '';
  if(p.startsWith('00'))p=p.slice(2); else if(p.startsWith('0'))p='20'+p.slice(1); else if(p.length===10&&p[0]==='1')p='20'+p;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(text);
}
function warrantyEnd(d){
  const w=d.warranty||{}; if(!(w.on&&w.months))return '';
  const ws=w.start||d.deliveredAt||''; if(!ws)return '';
  const e=parse(ws); e.setMonth(e.getMonth()+Number(w.months)); return iso(e);
}
const sameCust=(a,b)=>a.id!==b.id&&((digits(a.phone)&&digits(a.phone)===digits(b.phone))||(String(a.customer||'').trim()&&String(a.customer||'').trim()===String(b.customer||'').trim()));
const custDevices=d=>devs().filter(x=>sameCust(d,x));
const loyEvery=()=>{const n=Number(settings().loyEvery);return n>0?n:5};
const sameModel=(a,b)=>String(a.model||'').trim()&&String(a.model||'').trim().toLowerCase()===String(b.model||'').trim().toLowerCase();
function swInfo(p){
  if(!(num(p.sw)>0)||!p.date)return null;
  const end=addDays(p.date,num(p.sw)); return {end,left:Math.floor((parse(end)-parse(today()))/864e5)};
}
function swText(p){
  const i=swInfo(p); if(!i)return '';
  return i.left<0?` · <span class="crit">ضمان التاجر خلص ${dshow(i.end)}</span>`
    :` · ضمان التاجر لحد ${dshow(i.end)}${i.left<=7?` <span class="crit">(باقي ${i.left} يوم)</span>`:''}`;
}
function cashBalance(){
  const opening=num(finSettings().opening);
  const collectedAll=devs().reduce((s,d)=>s+paidOf(d),0);
  const partsDirect=devs().reduce((s,d)=>s+(d.parts||[]).filter(p=>!p.fromStock).reduce((a,p)=>a+num(p.price)+num(p.shipping),0),0);
  const stockSpent=cache.inventory.reduce((s,i)=>s+num(i.spent),0);
  const expAll=cache.expenses.reduce((s,e)=>s+num(e.amount),0);
  const lossAll=cache.losses.reduce((s,e)=>s+num(e.amount),0);
  return opening+collectedAll-partsDirect-stockSpent-expAll-lossAll;
}
function monthRangeOf(ref){const d=parse(ref);return {from:iso(new Date(d.getFullYear(),d.getMonth(),1)),to:iso(new Date(d.getFullYear(),d.getMonth()+1,0))}}
const monthLabel=ref=>{const d=parse(ref);return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`};

/* ---------- dashboard (top of the devices tab) ---------- */
function renderDash(){
  const el=$('#dash'); if(!el)return;
  const ds=devs(), t=today();
  const ready=ds.filter(d=>d.status==='ready'||d.status==='hold').length;
  const stale=ds.filter(isStale).length;
  const doneToday=ds.filter(d=>d.status==='done'&&d.deliveredAt===t);
  const profit=doneToday.reduce((s,d)=>s+num(d.price),0)-partsLoggedIn({from:t,to:t});
  let sw=0; ds.forEach(d=>(d.parts||[]).forEach(p=>{const i=swInfo(p); if(i&&i.left>=0&&i.left<=7)sw++}));
  const low=cache.inventory.filter(i=>num(i.min)>0&&num(i.qty)<=num(i.min)).length;
  const st=(n,l,cls)=>`<div class="stat"><b class="${cls||''}">${n}</b><span>${l}</span></div>`;
  let h=`<div class="dash">${st(ready,'جاهز للتسليم')}${st(stale,'متأخر',stale?'crit':'')}${st(doneToday.length,'اتسلم النهاردة')}${isAdmin?st(fmt(profit),'ربح النهاردة بعد قطع الغيار (قبل المصاريف)',profit>=0?'good':'crit'):''}${sw?st(sw,'ضمان تاجر قرب ينتهي','crit'):''}${low?st(low,'قطع مخزون قليل','crit'):''}</div>`;
  if(isAdmin){
    let last=0; try{last=Number(localStorage.getItem('rc_last_backup')||0)}catch(e){}
    if(!last||(Date.now()-last)/864e5>30)h+=`<div class="banner">عدّى أكتر من 30 يوم من آخر نسخة احتياطية للبيانات. <div class="links"><button data-tab="set">افتح الإعدادات وحمّل نسخة</button></div></div>`;
  }
  el.innerHTML=h;
}

/* ---------- extra sections inside the device sheet ---------- */
function devExtraSections(d){
  const hist=custDevices(d).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const pts=hist.filter(x=>x.status==='done').length+(d.status==='done'?1:0);
  const flags=[];
  hist.forEach(x=>{const we=warrantyEnd(x); if(we&&we>=today())flags.push(`${esc(x.model||'جهاز')} (#${String(x.no||0).padStart(4,'0')}) عليه ضمان ساري لحد ${dshow(we)}`)});
  const recent=d.status!=='done'?hist.find(x=>x.status==='done'&&x.deliveredAt&&sameModel(x,d)&&daysAgo(x.deliveredAt)<=30):null;
  const alertH=(flags.length||recent)?`<div class="banner"><b>انتبه:</b> ${recent?`العميل ده استلم نفس الموديل من ${daysAgo(recent.deliveredAt)} يوم، يمكن رجوع بنفس العطل (احتمال ضمان مجاني). `:''}${flags.join('، ')}</div>`:'';
  const histH=`<h3>سجل العميل</h3><div class="box">${alertH}${hist.length?hist.slice(0,6).map(x=>`<div class="item"><div class="t"><b>${esc(x.model||'جهاز')} · #${String(x.no||0).padStart(4,'0')}</b><div>${esc(x.issue||'')} · ${(STM[x.status]||STM.wait).l}${x.deliveredAt?' · '+dshow(x.deliveredAt):''}</div></div></div>`).join(''):'<div class="hint">مفيش أجهزة تانية للعميل ده.</div>'}<div class="hint" style="margin-top:8px">أجهزة اتسلمت للعميل: ${pts} · كل ${loyEvery()} أجهزة مكافأة (خصم أو خدمة مجانية)${pts>0&&pts%loyEvery()===0?' ← وصل للمكافأة':''}</div></div>`;
  const q=d.qc||{};
  const qcH=`<h3>فحص الجودة قبل التسليم</h3><div class="box form">${q.date?`<div class="hint">${q.ok?'<span class="good">اجتاز الفحص</span>':'<span class="crit">فيه ملاحظة</span>'}${q.note?' · '+esc(q.note):''} · ${dshow(q.date)}</div>`:'<div class="hint">لسه ماتفحصش.</div>'}${field('ملاحظة (اختياري)','<input id="q-note">')}<div class="g2"><button class="btn soft" data-act="qc-ok">اجتاز الفحص ✓</button><button class="btn danger" data-act="qc-bad">فيه ملاحظة</button></div></div>`;
  const callH=`<h3>سجل المكالمات</h3><div class="box">${(d.calls||[]).length?d.calls.map(c=>`<div class="item"><div class="t"><b>${dshow(c.date)}</b><div>${esc(c.note||'')}</div></div><button class="btn sm danger" data-act="del-call" data-pid="${esc(c.id)}">حذف</button></div>`).join(''):'<div class="hint" style="margin-bottom:8px">مفيش مكالمات متسجلة.</div>'}<div class="form" style="margin-top:10px">${field('ملاحظة المكالمة','<input id="c-note" placeholder="كلمته وأكد السعر / هيستلم بكرة">')}<button class="btn soft" data-act="add-call">تسجيل مكالمة</button></div></div>`;
  const dg=d.diag||{};
  const diagH=(dg.amp||dg.det||num(d.timeMin))?`<h3>بيانات الفحص الفني</h3><div class="box"><div class="rows">${dg.amp?`<div class="row"><span>سحب الأمبير عند الاستلام</span><span class="mono">${esc(dg.amp)}</span></div>`:''}${dg.det?`<div class="row"><span>اتعرف على الكمبيوتر؟</span><span>${esc(dg.det)}</span></div>`:''}${num(d.timeMin)?`<div class="row"><span>وقت الشغل</span><span class="num">${fmt(d.timeMin)}</span> دقيقة</div>`:''}</div></div>`:'';
  const rateH=d.status==='done'?`<h3>تقييم العميل</h3><div class="box"><div class="chips" style="flex-wrap:wrap;overflow:visible">${[1,2,3,4,5].map(n=>`<button class="chip ${d.rating===n?'on':''}" data-act="rate" data-k="${n}">${n}★</button>`).join('')}<button class="chip" data-act="rate" data-k="0">مسح</button></div></div>`:'';
  const kbH=`<button class="btn ghost" data-act="kb-from-dev" style="width:100%;margin-bottom:12px">دوّر في مرجع الأعطال عن العطل ده</button>`;
  return histH+diagH+qcH+callH+rateH+kbH;
}

/* ---------- price comparison across suppliers (from data already entered) ---------- */
function renderCompare(){
  const out=$('#pcres'), inp=$('#pc-q'); if(!out||!inp)return;
  const q=inp.value.trim().toLowerCase();
  if(!q){out.innerHTML='<div class="hint">اكتب اسم القطعة (مثال: شاشة A52) وهيظهر سعرها عند كل تاجر اشتريت منه (شامل الشحن للقطع اللي اتشترت لأجهزة).</div>';return}
  const rows=[];
  devs().forEach(d=>(d.parts||[]).forEach(p=>{if(!p.fromStock&&p.supplier&&String(p.name||'').toLowerCase().includes(q))rows.push({sup:p.supplier.trim(),price:num(p.price)+num(p.shipping),t:p.date||''})}));
  cache.inventory.forEach(i=>{if(i.supplier&&(String(i.name||'')+' '+String(i.model||'')).toLowerCase().includes(q))rows.push({sup:i.supplier.trim(),price:num(i.buyPrice),t:i.createdAt?iso(new Date(i.createdAt)):''})});
  const g={}; rows.forEach(r=>{const o=g[r.sup]||(g[r.sup]={sup:r.sup,min:Infinity,last:0,lastT:'',n:0}); o.min=Math.min(o.min,r.price); o.n++; if(!o.lastT||r.t>=o.lastT){o.lastT=r.t;o.last=r.price}});
  const list=Object.values(g).sort((a,b)=>a.min-b.min);
  out.innerHTML=list.length?list.map((o,i)=>`<div class="item"><div class="t"><b>${esc(o.sup)}</b>${i===0&&list.length>1?' <span class="qual">الأرخص</span>':''}<div>أقل سعر ${money(o.min)} · آخر سعر ${money(o.last)} · ${o.n} مرة</div></div></div>`).join(''):'<div class="hint">مفيش تاجر متسجل بالقطعة دي لسه.</div>';
}

/* ---------- stats ---------- */
function statsHtml(){
  const ds=devs(), done=ds.filter(d=>d.status==='done'&&d.deliveredAt);
  const rep={};
  ds.forEach(d=>{
    if(!d.model)return; const created=d.createdAt?iso(new Date(d.createdAt)):d.entryDate; if(!created)return;
    const prev=done.filter(x=>x.id!==d.id&&sameCust(d,x)&&sameModel(x,d)&&x.deliveredAt<=created&&(parse(created)-parse(x.deliveredAt))/864e5<=30).sort((a,b)=>b.deliveredAt.localeCompare(a.deliveredAt))[0];
    if(prev&&prev.tech)rep[prev.tech]=(rep[prev.tech]||0)+1;
  });
  const techs={}; done.forEach(d=>{const k=d.tech||'بدون فني'; const o=techs[k]||(techs[k]={n:0,profit:0,rs:0,rn:0}); o.n++; o.profit+=num(d.price)-partCost(d); if(d.rating){o.rs+=d.rating;o.rn++}});
  const tl=Object.entries(techs).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>`<div class="item"><div class="t"><b>${esc(k)}</b><div>${o.n} جهاز اتسلم · رجوع بنفس العطل خلال 30 يوم: ${rep[k]||0}${o.rn?` · متوسط التقييم ${(o.rs/o.rn).toFixed(1)}★`:''}</div></div><span class="${o.profit>=0?'good':'crit'}">${money(o.profit)}</span></div>`).join('');
  const pc={}; ds.forEach(d=>(d.parts||[]).forEach(p=>{const k=String(p.name||'').trim().toLowerCase(); if(!k)return; const o=pc[k]||(pc[k]={name:p.name.trim(),n:0,cost:0}); o.n++; o.cost+=num(p.price)+num(p.shipping)}));
  const pl=Object.values(pc).sort((a,b)=>b.n-a.n).slice(0,8).map(o=>`<div class="item"><div class="t"><b>${esc(o.name)}</b></div><span class="num">${o.n} مرة</span></div>`).join('');
  const fc={}; done.forEach(d=>{const k=String(d.issue||'').trim(); if(!k)return; const o=fc[k]||(fc[k]={k,n:0,profit:0}); o.n++; o.profit+=num(d.price)-partCost(d)});
  const fl=Object.values(fc).sort((a,b)=>b.profit-a.profit).slice(0,8).map(o=>`<div class="item"><div class="t"><b>${esc(o.k)}</b><div>${o.n} مرة · متوسط ${money(o.profit/o.n)}</div></div><span class="${o.profit>=0?'good':'crit'}">${money(o.profit)}</span></div>`).join('');
  const mc={}; ds.forEach(d=>{const m=String(d.model||'').trim(), i=String(d.issue||'').trim(); if(!m||!i)return; const o=mc[m.toLowerCase()]||(mc[m.toLowerCase()]={m,n:0,f:{}}); o.n++; o.f[i]=(o.f[i]||0)+1});
  const ml=Object.values(mc).filter(o=>o.n>=2).sort((a,b)=>b.n-a.n).slice(0,8).map(o=>{const top=Object.entries(o.f).sort((a,b)=>b[1]-a[1])[0]; return `<div class="item"><div class="t"><b>${esc(o.m)}</b><div>الأكتر: ${esc(top[0])} (${top[1]} من ${o.n})</div></div></div>`}).join('');
  const blk=(t,h,e)=>`<h3 style="margin-top:12px">${t}</h3>${h||`<div class="hint">${e}</div>`}`;
  return secBox('stats','الإحصائيات',`${blk('أداء كل فني',tl,'لسه مفيش أجهزة اتسلمت.')}${blk('أكتر القطع استهلاكًا',pl,'لسه مفيش قطع متسجلة على أجهزة.')}${blk('الأعطال الأعلى ربحًا',fl,'لسه مفيش أجهزة اتسلمت بعطل مكتوب.')}${blk('العطل الأكتر لكل موديل',ml,'محتاج على الأقل جهازين من نفس الموديل.')}<div class="hint" style="margin-top:10px">الأعطال بتتجمع بنفس النص المكتوب، فاكتب العطل بنفس الصيغة كل مرة (مثال: "شاشة" مش مرة "شاشة" ومرة "تغيير شاشة").</div>`);
}

const VX_DUE_RE=new RegExp('(^|\\s)((?:بعد\\s+(?:بكره|ساعه\\s+ونص|ساعه|ساعتين|ساعات|يوم|يومين|اسبوع|اسبوعين|شهر|نص\\s+ساعه|ربع\\s+ساعه|\\d+\\s+(?:ساعات|ساعه|ايام|يوم|دقيقه|دقايق|اسبوع|اسابيع)|'+VX_NUMW+'\\s+(?:ساعات|ايام))|بكره|النهارده|انهارده|الليله|(?:يوم\\s+)?(?:السبت|الاحد|الاثنين|الاتنين|الثلاثاء|التلات|الاربع|الاربعاء|الخميس|الجمعه)|(?:الاسبوع|الشهر)\\s+(?:الجاي|الجايه|القادم|الجاى)|اخر\\s+(?:اليوم|النهار)|خلال\\s+\\S+(?:\\s+(?:ساعات|ساعه|ايام|يوم|اسبوع|ساعتين|يومين))?|(?:الساعه|ساعه)\\s+\\d+(?:\\s+(?:الضهر|العصر|بالليل|المغرب|الصبح))?))(?=\\s|$)');
const VX_LAB2=[['اسم العميل','customer'],['نوع الجهاز','model'],['رقم التليفون','phone'],['رقم الموبايل','phone'],['رقم الجوال','phone']].map(([k,v])=>[vxN(k),v]);
const VX_LAB1=new Map([['العميل','customer'],['الاسم','customer'],['اسم','customer'],['موديل','model'],['الموديل','model'],['العطل','issue'],['عطل','issue'],['المشكله','issue'],['مشكله','issue'],['المشكلة','issue'],['ملاحظات','notes'],['ملاحظه','notes'],['ملاحظة','notes']].map(([k,v])=>[vxN(k),v]));
const vxFault=t=>{
  const n=t.n;
  return n==='مش'||n==='ميت'||/^م(?:بي|بت|ب)\S*ش$/.test(n)||/^(?:ال|و|وال)?(?:شاش|بطار|شحن|بيشحن|شاحن|سماع|مايك|ميكروف|كامير|تاتش|لمس|صوت|سبيكر|شبك|سيم|بصم|زرار|ازرار|باور|فلات|فلاش|ريستارت|هنج|هنك|سوفت|فورمات|غرق|مياه|وقع|واقع|اتكسر|مكسور|كسر|سخن|بيسخن|بيفصل|بتفصل|فصل|بيهنج|بتهنج|معلق|بيعلق|تغيير|تبديل|تغير|اهتزاز|فيبره|بورده|ايسي|تقطيع|ظلام|سواد|لوحه|مشكل|عطل)/.test(n);

function vxFind(T,re){
  const starts=[],parts=[]; let pos=0;
  T.forEach(t=>{const x=t.used?'§':t.n; starts.push(pos); parts.push(x); pos+=x.length+1});
  const s=parts.join(' '), m=re.exec(s); if(!m)return null;
  const off=m.index+m[1].length, end=off+m[2].length;
  const i0=starts.indexOf(off); if(i0<0)return null;
  let i1=i0; while(i1<T.length-1&&starts[i1]+parts[i1].length<end)i1++;
  return {i0,i1,text:m[2]};
}
function vxTok(text){
  const t=vxDig(text).replace(/[،,؛;؟?!:"«»()\[\]]+/g,' ').replace(/\.(?=\s|$)/g,' ').replace(/\s+/g,' ').trim();
  if(!t)return [];
  return t.split(' ').map(w=>({w,n:vxN(w),used:false}));
}
/* understands free speech: phone, price, delivery time, device model, fault, customer name, notes */
function parseVoice(text){
  const T=vxTok(text), out={}; if(!T.length)return out;
  const mark=(a,b)=>{for(let i=a;i<=b;i++)T[i].used=true};
  const words=idx=>idx.map(i=>T[i].w).join(' ');
  const free=i=>i>=0&&i<T.length&&!T[i].used;

  /* 1. phone: a run of digit tokens (or spoken digit words) that looks like a phone number */
  const isD=t=>/^\+?\d+$/.test(t.n)||VX_DIGW[t.n]!==undefined;
  const dv=t=>/^\+?\d+$/.test(t.n)?t.n.replace('+',''):String(VX_DIGW[t.n]);
  for(let i=0;i<T.length&&!out.phone;i++){
    if(T[i].used||!isD(T[i]))continue;
    let j=i,s=''; while(j<T.length&&!T[j].used&&isD(T[j])){s+=dv(T[j]);j++}
    s=s.replace(/^00/,''); if(/^20\d{10}$/.test(s))s='0'+s.slice(2);
    let p=''; const m=s.match(/01[0125]\d{8}/);
    if(m)p=m[0]; else if(/^0\d{8,10}$/.test(s))p=s; else if(/^1[0125]\d{8}$/.test(s))p='0'+s;
    if(p){out.phone=p; mark(i,j-1); let k=i-1; while(free(k)&&vxHas(VX_PHONEMARK,T[k].n)){T[k].used=true;k--}}
    i=j-1;
  }
  /* 2. price */
  for(const re of VX_PRICE_RES){
    const r=vxFind(T,re); if(!r)continue;
    const d=r.text.match(/\d+/); let amt=d?Number(d[0]):0;
    if(!d)r.text.split(' ').forEach(w=>{if(VX_WNUM[w])amt=VX_WNUM[w]});
    if(amt>0){out.price=amt; mark(r.i0,r.i1); break}
  }
  /* 3. delivery time */
  const rd=vxFind(T,VX_DUE_RE);
  if(rd){out.due=words(Array.from({length:rd.i1-rd.i0+1},(_,k)=>rd.i0+k)); mark(rd.i0,rd.i1); let k=rd.i0-1; while(free(k)&&vxHas(VX_DUEMARK,T[k].n)){T[k].used=true;k--}}

  /* 4. explicit labels ("الموديل ..."، "العطل ..."، "ملاحظات ...") still work */
  const labs=[];
  for(let i=0;i<T.length;i++){
    if(T[i].used)continue;
    const two=i+1<T.length&&!T[i+1].used?VX_LAB2.find(p=>p[0]===T[i].n+' '+T[i+1].n):null;
    if(two){labs.push({i,len:2,f:two[1]});i++;continue}
    const f=VX_LAB1.get(T[i].n); if(f)labs.push({i,len:1,f});
  }
  labs.forEach((L,li)=>{
    const end=li+1<labs.length?labs[li+1].i:T.length;
    mark(L.i,L.i+L.len-1);
    if(L.f==='phone'||out[L.f])return;
    const idx=[]; for(let i=L.i+L.len;i<end;i++){ if(!T[i].used)idx.push(i) }
    let take=idx;
    if(L.f==='customer'){take=[]; for(const i of idx){ const t=T[i]; if(take.length>=3||vxHas(VX_FILL,t.n)||vxHas(VX_BRAND,t.n)||vxFault(t)||/\d/.test(t.n)||vxHas(VX_CUSTMARK,t.n))break; take.push(i)}}
    if(take.length){out[L.f]=words(take); take.forEach(i=>T[i].used=true)}
  });

  /* 5. notes: everything after "وفيه / وفيها / ملاحظات..." */
  if(!out.notes){
    const k=T.findIndex(t=>!t.used&&VX_NOTESTART.has(t.n));
    if(k>=0){
      const idx=[]; for(let i=k;i<T.length;i++){ if(!T[i].used)idx.push(i) }
      const skip=/^(ملاحظات|ملاحظه|لاحظت)$/.test(T[k].n);
      const body=idx.map((i,q)=>q===0?(skip?'':T[i].w.replace(/^و/,'')):T[i].w).filter(Boolean).join(' ');
      if(body){out.notes=body}
      idx.forEach(i=>T[i].used=true);
    }
  }

  /* 6. device model: a known brand + the model words after it, or a latin model code like A52 */
  if(!out.model){
    let bi=-1;
    for(let i=0;i<T.length;i++){ if(free(i)&&vxHas(VX_BRAND,T[i].n)){bi=i;break} }
    if(bi<0){ for(let i=0;i<T.length;i++){ if(free(i)&&/^(?:[a-z]+\d+[a-z+]*|\d+[a-z]+)$/.test(T[i].n)){bi=i;break} } }
    if(bi>=0){
      const idx=[bi], parts=[vxFix(T[bi].w)]; let j=bi+1;
      while(free(j)&&parts.length<7&&!vxFault(T[j])&&!vxHas(VX_CUSTMARK,T[j].n)&&!vxHas(VX_BRAND,T[j].n)){
        const n=T[j].n;
        if(VX_LETTERS.has(n)&&free(j+1)&&/^\d/.test(T[j+1].n)){parts.push(VX_LETTERS.get(n)+T[j+1].w);idx.push(j,j+1);j+=2;continue}
        if(/^[a-z0-9+\-]+$/.test(n)||vxHas(VX_MODELW,n)){parts.push(vxFix(T[j].w));idx.push(j);j++;continue}
        break;
      }
      out.model=parts.join(' '); idx.forEach(i=>T[i].used=true);
    }
  }

  /* 7. fault: from the first fault word to the end of that phrase */
  if(!out.issue){
    const s=T.findIndex(t=>!t.used&&vxFault(t));
    if(s>=0){
      const idx=[s]; let j=s+1;
      while(free(j)&&!vxHas(VX_BRAND,T[j].n)&&!vxHas(VX_CUSTMARK,T[j].n)&&!vxHas(VX_ISSUESTOP,T[j].n)){idx.push(j);j++}
      out.issue=words(idx); idx.forEach(i=>T[i].used=true);
    }
  }

  /* 8. customer name: after a marker ("اسمه"، "العميل"، "بتاع"، "الحاج") or the first free words that look like a name */
  if(!out.customer){
    const stopName=i=>!free(i)||vxHas(VX_FILL,T[i].n)||vxHas(VX_BRAND,T[i].n)||vxFault(T[i])||/\d/.test(T[i].n)||vxHas(VX_CUSTMARK,T[i].n);
    let found=null;
    for(let i=0;i<T.length&&!found;i++){
      if(!free(i)||!vxHas(VX_CUSTMARK,T[i].n))continue;
      let k=i; const heads=[]; while(free(k)&&vxHas(VX_CUSTMARK,T[k].n)){heads.push(k);k++}
      const nm=[]; while(nm.length<3&&k<T.length&&!stopName(k)){nm.push(k);k++}
      if(nm.length)found={heads,nm};
    }
    if(found){
      const keep=found.heads.filter(i=>vxHas(VX_TITLE,T[i].n));
      out.customer=words([...keep,...found.nm]); found.heads.concat(found.nm).forEach(i=>T[i].used=true);
    }else{
      let k=0; while(k<T.length&&stopName(k))k++;
      const nm=[]; while(nm.length<3&&k<T.length&&!stopName(k)){nm.push(k);k++}
      if(nm.length){out.customer=words(nm); nm.forEach(i=>T[i].used=true)}
    }
  }

  /* 9. anything left over goes to the notes so nothing you said is lost */
  const left=T.filter(t=>!t.used&&!vxHas(VX_FILL,t.n)&&!vxHas(VX_CUSTMARK,t.n)).map(t=>t.w);
  if(left.length)out.notes=((out.notes?out.notes+' ':'')+left.join(' ')).trim();
  return out;
}

/* ----- voice recording + follow-up questions ----- */
const VX_IDS={customer:'f-customer',phone:'f-phone',model:'f-model',issue:'f-issue',notes:'f-notes',due:'f-due',price:'f-price'};

const VQ_ASK=[['customer','اسم العميل إيه؟'],['phone','رقم التليفون كام؟'],['model','نوع الجهاز إيه؟ (مثال: سامسونج A52)'],['issue','العطل إيه؟'],['due','ميعاد التسليم إمتى؟']];

  if(vq.auto)setTimeout(()=>{if(vq&&vq.auto&&$('#devform')&&!voiceRec)vqListen()},500);
}
function vqApply(text){
  if(!vq)return false;

function vqListen(){

  const mic=$('[data-act="vq-mic"]'); if(mic)mic.textContent='⏹ بسمعك...';
  rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)buf+=' '+ev.results[i][0].transcript}};
  rec.onerror=ev=>{if(vq)vq.auto=false; toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'اسمح للمتصفح باستخدام المايك':ev.error==='no-speech'?'مسمعتش حاجة، جرب تاني':'التسجيل مانفعش، جرب تاني')};
  rec.onend=()=>{
    voiceRec=null; const m=$('[data-act="vq-mic"]'); if(m)m.textContent='🎤';
    if(!vq||!$('#devform'))return;
    if(buf.trim()){vq.auto=true; if(!vqApply(buf))vq.auto=false} else vq.auto=false;
  };
  try{rec.start()}catch(e){voiceRec=null; if(mic)mic.textContent='🎤'; toast('التسجيل مانفعش، جرب تاني')}
}
function voiceFill(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('المتصفح ده مش بيدعم التسجيل الصوتي، استخدم كروم');return}
  if(voiceRec){try{voiceRec.stop()}catch(e){} return}
  vq=null; const vqBox=$('#vq'); if(vqBox)vqBox.innerHTML='';
  const rec=new SR(); voiceRec=rec; let buf='';
  rec.lang='ar-EG'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=1;
  const label='🎤 سجّل بالصوت', hint=$('#vhint');
  btn.textContent='⏹ بسمعك... دوس لما تخلص'; btn.classList.add('danger');
  rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)buf+=' '+ev.results[i][0].transcript}};
  rec.onerror=ev=>{toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'اسمح للمتصفح باستخدام المايك':ev.error==='no-speech'?'مسمعتش حاجة، جرب تاني':'التسجيل مانفعش، جرب تاني')};
  rec.onend=()=>{
    voiceRec=null; btn.textContent=label; btn.classList.remove('danger');
    const text=buf.trim(); if(!text||!$('#devform'))return;
    const p=parseVoice(text), shown=[];
    Object.keys(p).forEach(k=>{const el=$('#'+VX_IDS[k]); if(!el)return; el.value=p[k]; shown.push(VX_NAMES[k]+': '+p[k])});
    if(hint)hint.innerHTML='سمعتك: «'+esc(text)+'»<br>فهمت: '+(shown.length?esc(shown.join(' · ')):'<b class="crit">مفهمتش حاجة محددة</b>')+'<br>راجع الخانات وصحّح لو فيه غلط.';
    vq={i:0,auto:false}; vqNext();
  };
  try{rec.start()}catch(e){voiceRec=null;btn.textContent=label;btn.classList.remove('danger');toast('التسجيل مانفعش، جرب تاني')}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const a=b.dataset.act;
  if(a==='voice-fill')voiceFill(b);
  else if(a==='vq-mic')vqListen();
  else if(a==='vq-ok'){const i=$('#vq-in'); if(i)vqApply(i.value)}
  else if(a==='vq-skip'){if(vq){vq.i++; vq.auto=false; vqNext()}}
  else if(a==='vq-stop'){vq=null; if(voiceRec){try{voiceRec.stop()}catch(x){}} const bx=$('#vq'); if(bx)bx.innerHTML=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='vq-in'){e.preventDefault(); vqApply(e.target.value)}});

boot();
})();
</script>
