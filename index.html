/* ----- attendance: fingerprint (WebAuthn) + location ----- */
const attSet=()=>cache.settings.find(x=>x.id==='attendance')||{};
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const credKey=()=>'rc_cred_'+((session&&session.user&&session.user.id)||'');
const myCred=()=>{try{return localStorage.getItem(credKey())||''}catch(e){return ''}};
function myMemberName(){const uid=session&&session.user&&session.user.id; const m=cache.members.find(x=>x.id===uid); return (m&&m.name)||(session&&session.user&&(session.user.name||session.user.email))||'—'}
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0}):rej({code:0}))}
async function fpRegister(){
  if(!window.PublicKeyCredential||!navigator.credentials){toast('المتصفح ده مش بيدعم البصمة. افتح الرابط من Chrome أو Safari على HTTPS');return false}
  const uid=session.user.id;
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'4G Academy',id:location.hostname},
      user:{id:new TextEncoder().encode(uid).slice(0,64),name:session.user.email||uid,displayName:myMemberName()},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    const id=b64u(cred.rawId);
    try{localStorage.setItem(credKey(),id)}catch(e){}
    const cur=cache.creds.find(x=>x.id===uid); const ids=[...new Set([...(cur&&cur.ids||[]),id])];
    await safe(()=>put('creds',uid,{ids,updatedAt:Date.now()}));
    toast('تم تفعيل البصمة على الموبايل ده'); return true;
  }catch(e){ toast(e&&e.name==='NotAllowedError'?'اتلغى تفعيل البصمة':'مقدرتش أفعّل البصمة. اتأكد إن الموبايل عليه بصمة أو قفل شاشة والصفحة على HTTPS',6000); return false }
}
async function fpVerify(){
  const id=myCred(); if(!id)throw {nofp:true};
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64u(id)}],userVerification:'required',timeout:60000}});
}
function lastAtt(uid){return cache.attendance.filter(r=>r.uid===uid).sort((a,b)=>b.ts-a.ts)[0]}
function nextKind(uid){
  const l=lastAtt(uid);
  if(l&&l.kind==='in'&&Date.now()-l.ts<18*36e5)return 'out';
  const t=today();
  return cache.attendance.some(r=>r.uid===uid&&r.date===t&&r.kind==='in')?'done':'in';
}
function askPassword(){
  return new Promise(res=>{
    const w=document.createElement('div');
    w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    w.innerHTML='<form class="box" style="width:100%;max-width:360px;margin:0"><h2>تأكيد بكلمة السر</h2><div class="hint" style="margin-bottom:8px">اكتب كلمة سر حسابك في التطبيق.</div><input id="pw-in" type="password" autocomplete="current-password" style="width:100%" required><div class="acts" style="margin-top:10px"><button class="btn" type="submit">تأكيد</button><button class="btn soft" type="button" id="pw-x">إلغاء</button></div></form>';
    document.body.appendChild(w);
    const done=v=>{w.remove();res(v)};
    w.querySelector('#pw-x').onclick=()=>done(null);
    w.querySelector('form').onsubmit=e=>{e.preventDefault();done(w.querySelector('#pw-in').value)};
    setTimeout(()=>{try{w.querySelector('#pw-in').focus()}catch(e){}},50);
  });
}
async function pwVerify(){
  const pw=await askPassword(); if(pw===null)throw {cancel:true};
  const email=session&&session.user&&session.user.email;
  try{await http('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password:pw}})}
  catch(e){throw {badpw:true}}
}
async function attAct(btn){
  const s=attSet(), usePw=btn.dataset.mode==='pw'||!myCred();
  if(!s.lat||!s.lng){toast('الأدمن لسه ما حددش موقع المركز');return}
  const uid=session.user.id, kind=nextKind(uid);
  if(kind==='done'){toast('سجّلت حضورك وانصرافك النهاردة. مفيش تسجيل تاني في نفس اليوم',5000);return}
  btn.disabled=true; const old=btn.textContent; btn.textContent='جاري تحديد موقعك...';
  try{
    let pos; try{pos=await getPos()}catch(e){toast(e&&e.code===1?'اسمح للمتصفح بالوصول للموقع':'مقدرتش أحدد موقعك، اتأكد إن الـ GPS شغال وجرب تاني',6000);return}
    const d=distM(pos.coords.latitude,pos.coords.longitude,Number(s.lat),Number(s.lng)), rad=Number(s.radius)||100;
    if(d>rad){toast('إنت بعيد عن المركز بحوالي '+Math.round(d)+' متر. لازم تكون جوه '+rad+' متر',7000);return}
    if(usePw){
      try{await pwVerify()}catch(e){if(!(e&&e.cancel))toast('كلمة السر غلط',5000);return}
    }else{
      btn.textContent='أكّد بالبصمة...';
      try{await fpVerify()}catch(e){toast('البصمة ماتأكدتش. تقدر تسجّل بكلمة السر بدلها',6000);return}
    }
    const now=Date.now();
    if(await safe(()=>put('attendance',newId(),{uid,name:myMemberName(),kind,ts:now,date:iso(new Date(now)),lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0),dist:Math.round(d),fp:usePw?0:1,pw:usePw?1:0})))toast(kind==='in'?'اتسجل حضورك '+hm(now):'اتسجل انصرافك '+hm(now),5000);
  }finally{btn.disabled=false;btn.textContent=old}
}
function attSummary(uid,month){
  const recs=cache.attendance.filter(r=>r.uid===uid&&String(r.date).startsWith(month)).sort((a,b)=>a.ts-b.ts);
  let ms=0,open=null; const days=new Set();
  recs.forEach(r=>{ if(r.kind==='in'){open=r.ts;days.add(r.date)} else if(open){ms+=r.ts-open;open=null;days.add(r.date)} });
  return {days:days.size,hours:ms/36e5,open:!!open};
}
const hrs=h=>{const m=Math.round(h*60);return Math.floor(m/60)+' س '+pad(m%60)+' د'};
function attRowHtml(r,admin){

const byWho=()=>{const n=myMemberName(); return n&&n!=='—'?String(n).split('@')[0]:''};
async function audit(action,text){
  try{ await http('/rest/v1/docs?on_conflict=collection,id',{method:'POST',body:{collection:'audit',id:newId(),data:{ts:Date.now(),by:byWho(),action,text:String(text||'')}},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}}); }

function rangeOf(p,r){
  if(p==='day')return {from:r,to:r};
  if(p==='week'){const back=(parse(r).getDay()+1)%7;const f=addDays(r,-back);return {from:f,to:addDays(f,6)}}
  return monthRangeOf(r);
}

    return `<div class="row"><span>${l}</span><span>دخل <b class="num">${a}</b> · خرج <b class="num">${o}</b></span></div>`};

}

/* ----- clickable summary groups ----- */
const NEXT={wait:['check','ابدأ الفحص'],check:['ready','تم الإصلاح ← جاهز للتسليم'],part:['check','وصلت القطعة ← جاري الفحص']};
function groupDevs(k){
  const ds=devs(), t=today(), created=d=>d.createdAt?iso(new Date(d.createdAt)):d.entryDate;
  if(k==='in')return ds.filter(d=>created(d)===t);
  if(k==='out')return ds.filter(d=>d.status==='done'&&d.deliveredAt===t);
  if(k==='open')return ds.filter(d=>d.status!=='done');
  if(k==='ready')return ds.filter(d=>d.status==='ready'||d.status==='hold');
  if(k==='stale')return ds.filter(isStale);
  if(k==='wait'||k==='check'||k==='part')return ds.filter(d=>d.status===k);
  return [];
}
function openGroup(k){
  S.modal={type:'group',k};
  showModal(sheetHtml(esc(GROUPS[k]||''),'<div id="grpList"></div>'));
  refreshGroup();
}
function grpRow(d){
  const st=STM[d.status]||STM.wait, paid=paidOf(d), left=num(d.price)-paid, we=warrantyEnd(d), id=esc(d.id);
  let nxt='';
  if(d.status==='ready'||d.status==='hold')nxt=`<button class="btn sm" data-act="deliver" data-id="${id}">تم التسليم</button>`;
  else if(NEXT[d.status])nxt=`<button class="btn sm" data-act="grp-move" data-id="${id}" data-k="${NEXT[d.status][0]}">${NEXT[d.status][1]}</button>`;
  const other=d.status==='check'?`<button class="btn sm soft" data-act="grp-move" data-id="${id}" data-k="part">محتاج قطعة</button>`:'';
  const parts=(d.parts||[]).map(p=>esc(p.name)).join('، ');
  const pay=num(d.price)>0?`<span>دفع <b class="num">${fmt(paid)}</b> · متبقي <b class="num ${left>0?'crit':'good'}">${fmt(Math.max(0,left))}</b></span>`:'<span class="muted">لسه مفيش مبلغ متفق عليه</span>';
  const warr=we?` · ${we>=today()?'ضمان لحد '+dshow(we):'الضمان خلص '+dshow(we)}`:'';
  return `<div class="grow"><div class="gh"><button type="button" data-act="open-dev" data-id="${id}" style="background:none;border:0;text-align:start;padding:0;cursor:pointer;color:inherit"><b>#${String(d.no||0).padStart(4,'0')} · ${esc(d.customer||'بدون اسم')}</b></button><span class="pill ${st.c}">${st.l}</span></div>
   <div class="gs">${esc(d.model||'')}${d.issue?' · '+esc(d.issue):''}${d.urgent?' · <b class="crit">عاجل جدًا</b>':''}</div>
   <div class="gs">${pay}${warr}${d.addedBy?' · سجّله '+esc(d.addedBy):''}</div>
   ${parts?`<div class="gs">القطع: ${parts}</div>`:''}
   <div class="ga">${nxt}${other}<button class="btn sm ghost" data-act="open-dev" data-id="${id}">فتح الجهاز</button></div>
   <details data-id="${id}"><summary>+ إضافة قطعة غيار</summary><div class="form" style="margin-top:8px">
     <div class="g2">${field('اسم القطعة',`<input id="gp-name-${id}" placeholder="شاشة / آي سي">`)}${field('التكلفة (ج)',`<input id="gp-price-${id}" type="number" inputmode="decimal" step="any" min="0">`)}</div>
     ${field('التاجر (اختياري)',`<input id="gp-sup-${id}" list="dl-suppliers">`)}
     <button class="btn soft sm" type="button" data-act="grp-part" data-id="${id}">إضافة القطعة</button></div></details></div>`;
}
function refreshGroup(){
  const box=$('#grpList'); if(!box||!S.modal||S.modal.type!=='group')return;
  const ae=document.activeElement;
  if(ae&&box.contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
  const typed={}, opened=new Set();
  box.querySelectorAll('input[id]').forEach(i=>{if(i.value)typed[i.id]=i.value});
  box.querySelectorAll('details[open]').forEach(d=>opened.add(d.dataset.id));
  const list=groupDevs(S.modal.k).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||(b.createdAt||0)-(a.createdAt||0));
  box.innerHTML=list.length?`<div class="hint" style="margin-bottom:6px">${devicesWord(list.length)}</div>`+list.map(grpRow).join(''):'<div class="empty" style="border:0"><b>مفيش أجهزة هنا دلوقتي</b></div>';
  box.querySelectorAll('details').forEach(d=>{if(opened.has(d.dataset.id))d.open=true});
  Object.entries(typed).forEach(([k,v])=>{const el=document.getElementById(k); if(el)el.value=v});
  attachMics(box);
}
function openFault(key){
  const ds=devs().filter(d=>String(d.issue||'').trim().toLowerCase()===key);
  const name=(ds[0]&&String(ds[0].issue).trim())||key;
  const m={}; ds.forEach(d=>{const k=String(d.model||'').trim()||'موديل غير مكتوب'; const o=m[k.toLowerCase()]||(m[k.toLowerCase()]={k,n:0}); o.n++});
  const arr=Object.values(m).sort((a,b)=>b.n-a.n), mx=Math.max(1,...arr.map(o=>o.n));
  S.modal={type:'fault'};
  showModal(sheetHtml(esc(name),`<div class="box"><div class="hint" style="margin-bottom:6px">أكتر الموديلات اللي دخلت بالعطل ده (${devicesWord(ds.length)})</div>${arr.map(o=>`<div class="brow"><div class="top2"><b>${esc(o.k)}</b><span class="num">${o.n} مرة</span></div><div class="bar"><i style="width:${Math.max(2,Math.round(o.n/mx*100))}%"></i></div></div>`).join('')}</div>`));
}
document.addEventListener('click',async e=>{
  const pf=e.target.closest('[data-pref]'); if(pf){setPref(pf.dataset.pref,pf.dataset.v);return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='grp')return openGroup(b.dataset.k);
  if(a==='fault-open')return openFault(b.dataset.k);
  if(a==='grp-move'){
    const dv=devs().find(x=>x.id===id); if(!dv)return;
    const k=b.dataset.k; if(k===dv.status)return;
    await devPatch(dv.id,{status:k,statusAt:Date.now(),deliveredAt:'',statusBy:byWho()}); return;
  }
  if(a==='grp-part'){
    const dv=devs().find(x=>x.id===id); if(!dv)return;
    const nm=document.getElementById('gp-name-'+id), pr=document.getElementById('gp-price-'+id), sp=document.getElementById('gp-sup-'+id);
    const name=nm.value.trim(); if(!name){toast('اكتب اسم القطعة');return}
    const part={id:'p'+Date.now().toString(36),name,supplier:sp.value.trim(),price:num(pr.value),shipping:0,date:today(),by:byWho()};
    const warn=cheaperFor(part.name,part.price,part.supplier);
    const bk=[nm.value,pr.value,sp.value]; nm.value=''; pr.value=''; sp.value='';
    const ok=await devPatch(dv.id,{parts:[...(dv.parts||[]),part]});
    if(!ok){nm.value=bk[0];pr.value=bk[1];sp.value=bk[2]} else toast(warn||'اتضافت القطعة على الجهاز',warn?8000:0);
    return;
  }
});

const faultKinds=[['شحن',/شحن|بيشحن|شاحن|فلات ?شحن|usb|type ?c|موصل/i],['شاشة',/شاش|تاتش|لمس|كسر|مكسور|display|lcd/i],['بطارية',/بطار|battery|بيفصل|بتفصل|سخن/i],['باور',/باور|power|قصر|short|ميت|dead|pmic|مش بيفتح|مش بيشتغل|مبيشتغلش/i],['صوت',/صوت|سماع|سبيكر|مايك|ميكروف|جرس|رنين/i],['كاميرا',/كامير|camera|عدسه|عدسة/i],['شبكة',/شبك|سيم|sim|ايريال|إرسال|ارسال|واي ?فاي|wifi|بلوتوث/i],['سوفت وير',/سوفت|فورمات|هنج|هنك|تعليق|بيعلق|ريستارت|باسورد|قفل|frp|فلاش/i],['مياه',/مياه|ميه|غرق|مبلول|رطوب/i]];
function faultKind(t){t=String(t||''); const f=faultKinds.find(([k,rx])=>rx.test(t)); return f?f[0]:'أخرى'}
const normModel=m=>String(m||'').toLowerCase().replace(/[\s\-_]+/g,'');
function parseDueText(txt,from){
  const t=(typeof vxN==='function'?vxN(txt):String(txt||'')).trim(); if(!t)return '';
  from=from||today(); let n=null,m;
  if(/(النهارده|انهارده|الليله|اخر اليوم|خلال ساع|بعد (ساعه|ساعتين|ساعات|نص ساعه|ربع ساعه|\d+ ساع))/.test(t))n=0;
  else if(/بعد بكره/.test(t))n=2;
  else if(/بكره/.test(t))n=1;
  else if(/بعد يومين/.test(t))n=2;
  else if(/بعد يوم/.test(t))n=1;
  else if(m=t.match(/بعد (\d+) (يوم|ايام)/))n=Number(m[1]);
  else if(/بعد اسبوعين/.test(t))n=14;
  else if(/بعد اسبوع|الاسبوع الجاي/.test(t))n=7;
  else if(/بعد شهر|الشهر الجاي/.test(t))n=30;
  else if(m=t.match(/(?:يوم )?(السبت|الاحد|الاثنين|الاتنين|الثلاثاء|التلات|الاربع|الاربعاء|الخميس|الجمعه)/)){
    const map={السبت:6,الاحد:0,الاثنين:1,الاتنين:1,الثلاثاء:2,التلات:2,الاربع:3,الاربعاء:3,الخميس:4,الجمعه:5};
    const wd=map[m[1]], cur=parse(from).getDay(); n=((wd-cur+7)%7)||7;
  }
  return n===null?'':addDays(from,n);
}

function custMap(){

  devs().forEach(d=>{
    const k=custKey(d); if(!k||k==='n:')return;
    const o=m[k]||(m[k]={key:k,name:'',phone:'',list:[],done:0,last:0});
    o.list.push(d); if(d.status==='done')o.done++;
    const ts=d.createdAt||0; if(ts>=o.last){o.last=ts;o.name=d.customer||o.name;o.phone=d.phone||o.phone}
    if(!o.name)o.name=d.customer||''; if(!o.phone)o.phone=d.phone||'';
  });
  return m;
}

function backupDue(){
  let last=0; try{last=Number(localStorage.getItem('rc_last_backup')||0)}catch(e){}
  if(!last)return true; const a=new Date(last), b=new Date();
  return a.getFullYear()*12+a.getMonth()<b.getFullYear()*12+b.getMonth();
}
function msgLists(){
  const cn=BRAND; const ds=devs().filter(d=>d.status==='done'&&d.deliveredAt&&digits(d.phone));
  const sent=new Set(slist('msgsent','items').map(x=>x.k));
  const A=ds.filter(d=>daysAgo(d.deliveredAt)<=3);
  const B=ds.filter(d=>{const n=daysAgo(d.deliveredAt);return n>=90&&n<=150});
  const last={}; ds.forEach(d=>{const k=digits(d.phone); if(!last[k]||d.deliveredAt>last[k].deliveredAt)last[k]=d});
  const C=Object.values(last).filter(d=>daysAgo(d.deliveredAt)>=180);
  const mk=(st,list)=>list.map(d=>({st,d,k:st+'|'+custKey(d)+'|'+d.deliveredAt})).map(x=>({...x,sent:sent.has(x.k)}));
  return {after:mk('after',A),m3:mk('m3',B),m6:mk('m6',C)};
}
function repeatFaults(){
  const g={}; const lim=Date.now()-120*864e5;
  devs().forEach(d=>{ if(!d.model||(d.createdAt||0)<lim)return; const k=faultKind(d.issue); if(k==='أخرى')return;
    const key=normModel(d.model)+'|'+k; const o=g[key]||(g[key]={model:String(d.model).trim(),kind:k,n:0}); o.n++ });
  return Object.values(g).filter(o=>o.n>=3).sort((a,b)=>b.n-a.n);
}
function drawerGaps(){
  if(!isAdmin)return [];
  const out=[], cs=new Set(slist('drawer','items').map(x=>x.date)); const t=today();
  for(let i=1;i<=7;i++){
    const day=addDays(t,-i); if(cs.has(day))continue;
    const act=devs().some(d=>(d.payments||[]).some(p=>p.date===day)||d.deliveredAt===day)||cache.expenses.some(e=>e.date===day);
    if(act)out.push(day);
  }
  return out.slice(0,3);
}
function computeAlerts(){
  const hi=[],lo=[],mute=new Set(getMute()); const add=(a,type,o)=>{ if(!mute.has(type))a.push({type,...o}) };
  const open=devs().filter(d=>d.status!=='done');
  open.filter(dueOver).sort((a,b)=>a.dueAt.localeCompare(b.dueAt)).forEach(d=>add(hi,'overdue',{ic:'⏰',t:`${d.customer||'بدون اسم'} · ${d.model||''}`,s:`معاد التسليم عدّى من ${daysAgo(d.dueAt)} يوم${paidOf(d)>0?' · العميل دافع عربون':''}`,act:'open-dev',id:d.id}));
  open.filter(d=>isStale(d)&&!dueOver(d)).sort((a,b)=>(a.statusAt||0)-(b.statusAt||0)).forEach(d=>add(hi,'late',{ic:'🔔',t:`${d.customer||'بدون اسم'} · ${d.model||''}`,s:`من ${staleDays(d)} يوم من غير تحديث`,act:'open-dev',id:d.id}));
  open.filter(d=>(d.status==='ready'||d.status==='hold')&&statusDays(d)>=2).sort((a,b)=>(a.statusAt||0)-(b.statusAt||0)).forEach(d=>add(hi,'ready',{ic:'📦',t:`${d.customer||'بدون اسم'} · ${d.model||''}`,s:`جاهز من ${statusDays(d)} يوم ولسه محدش استلمه`,act:'open-dev',id:d.id,wa:waLink(d.phone,readyMsg(d))}));
  repeatFaults().forEach(o=>add(hi,'repeat',{ic:'🔁',t:`${o.model} · ${o.kind}`,s:`جه ${o.n} مرات بنفس النوع من العطل آخر 4 شهور`,act:'al-kb',q:o.model}));
  if(isAdmin){
    const L=msgLists(), n1=L.after.filter(x=>!x.sent).length, n3=L.m3.filter(x=>!x.sent).length, n6=L.m6.filter(x=>!x.sent).length;
    if(n1+n3+n6)add(hi,'cust',{ic:'💬',t:'عملاء مستنيين رسالة منك',s:[n1?n1+' تقييم بعد التسليم':'',n3?n3+' فحص بعد 3 شهور':'',n6?n6+' رجوع بعد 6 شهور':''].filter(Boolean).join(' · '),act:'msgs-open'});
    const pend=cache.members.filter(m=>!m.approved&&!m.disabled).length;
    if(pend)add(hi,'signup',{ic:'🙋',t:pend===1?'طلب تسجيل جديد':pend+' طلبات تسجيل جديدة',s:'مستنية موافقتك في الإعدادات',act:'tab',tab:'set'});
    drawerGaps().forEach(day=>add(hi,'nodrawer',{ic:'🧮',t:'يوم '+dshow(day)+' عدّى من غير جرد درج',s:'فيه حركة فلوس في اليوم ده',act:'tab',tab:'money'}));
    if(backupDue())add(hi,'backup',{ic:'💾',t:'نسخة الشهر لسه ما اتنزلتش',s:'دوس ونزّلها على جهازك',act:'backup-json'});
  }
  cache.inventory.filter(i=>num(i.min)>0&&num(i.qty)<=num(i.min)).sort((a,b)=>num(a.qty)-num(b.qty)).forEach(i=>add(lo,'lowstock',{ic:'📦',t:`${i.name||''}${i.model?' · '+i.model:''}`,s:`باقي ${num(i.qty)} (التنبيه عند ${num(i.min)})`,act:'open-item',id:i.id}));
  devs().forEach(d=>(d.parts||[]).forEach(p=>{const w=swInfo(p); if(w&&w.left>=0&&w.left<=7)add(lo,'swarr',{ic:'🛡️',t:`${p.name} · ${d.customer||''}`,s:`ضمان التاجر ينتهي بعد ${w.left} يوم`,act:'open-dev',id:d.id})}));
  return {hi,lo};
}

function groupDevs(k){
  const ds=devs(), t=today(), created=d=>d.createdAt?iso(new Date(d.createdAt)):d.entryDate;
  if(k==='in')return ds.filter(d=>created(d)===t);
  if(k==='out')return ds.filter(d=>d.status==='done'&&d.deliveredAt===t);
  if(k==='open')return ds.filter(d=>d.status==='wait'||d.status==='check'||d.status==='part');
  if(k==='ready')return ds.filter(d=>d.status==='ready'||d.status==='hold');
  if(k==='stale')return lateDevs();
  if(k==='wait'||k==='check'||k==='part')return ds.filter(d=>d.status===k);
  return [];
}

function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=()=>rej(new Error('read')); fr.onload=()=>{
      const im=new Image(); im.onerror=()=>rej(new Error('img')); im.onload=()=>{
        const mx=640, k=Math.min(1,mx/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.55));
      }; im.src=fr.result;
    }; fr.readAsDataURL(file);
  });
}

async function confirmIdentity(){
  const canFp=!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
  if(canFp){
    try{
      if(myCred()){await fpVerify();return 'fp'}
      if(await fpRegister(true))return 'fp';
    }catch(e){ if(e&&e.name==='NotAllowedError'){toast('اتلغى التأكيد');return ''} }
  }
  try{await pwVerify();return 'pw'}catch(e){ if(!(e&&e.cancel))toast('التأكيد ماتمش',4000); return ''}
}
async function attAct(btn){
  const s=attSet();
  if(!s.lat||!s.lng){toast('الأدمن لسه ما حددش موقع المركز');return}
  const uid=session.user.id, kind=nextKind(uid);
  if(kind==='done'){toast('سجّلت حضورك وانصرافك النهاردة',4000);return}
  btn.disabled=true; const old=btn.innerHTML; btn.textContent='...';
  try{
    let pos; try{pos=await getPos()}catch(e){toast(e&&e.code===1?'اسمح للمتصفح بالوصول للموقع':'مقدرتش أحدد موقعك، اتأكد إن الـ GPS شغال وجرب تاني',6000);return}
    const d=distM(pos.coords.latitude,pos.coords.longitude,Number(s.lat),Number(s.lng)), rad=Number(s.radius)||100;
    if(d>rad){
      safe(()=>put('attendance',newId(),{uid,name:myMemberName(),kind:'reject',want:kind,ts:Date.now(),date:today(),dist:Math.round(d),lat:pos.coords.latitude,lng:pos.coords.longitude}));
      toast('مش قادر أسجّل، لازم تكون في المركز',5000);return;
    }
    const how=await confirmIdentity(); if(!how)return;
    const now=Date.now();
    if(await safe(()=>put('attendance',newId(),{uid,name:myMemberName(),kind,ts:now,date:iso(new Date(now)),lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0),dist:Math.round(d),fp:how==='fp'?1:0,pw:how==='pw'?1:0}))){
      toast(kind==='in'?'اتسجل حضورك '+hm(now):'اتسجل انصرافك '+hm(now),4000);

}

/* ---------- drawer count (جرد الدرج) ---------- */
const dcounts=()=>slist('drawer','items');
const lastCount=()=>[...dcounts()].sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
function payTs(p){ if(p.ts)return p.ts; const m=/^y([0-9a-z]+)$/.exec(String(p.id||'')); if(m){const t=parseInt(m[1],36); if(t>1.4e12&&t<4e12)return t} return 0 }
function cashSince(c){
  let inc=0,out=0,tin=0,tout=0;
  const after=(ts,date)=>{ if(!c)return true; if(ts)return ts>c.ts; return String(date)>c.date||(String(date)===c.date&&c.type==='open') };
  devs().forEach(d=>(d.payments||[]).forEach(p=>{ if(p.method==='نقدي'&&after(payTs(p),p.date))inc+=num(p.amount) }));
  cache.expenses.forEach(e=>{ if(after(e.ts,e.date))out+=num(e.amount) });
  slist('transfers','items').forEach(t=>{ if(t.auto)return; if(after(t.ts,t.date)){ if(t.from===DRAWER)tout+=num(t.amount); if(t.to===DRAWER)tin+=num(t.amount) } });
  return {inc,out,tin,tout};
}
function expectedDrawer(){
  const c=lastCount(), f=cashSince(c);
  if(!c){ const op=num(finSettings().opening); if(op<=0)return null; return op+f.inc-f.out+f.tin-f.tout }
  return num(c.counted)+f.inc-f.out+f.tin-f.tout;
}
function openDrawerCount(type,opt){
  opt=opt||{}; S.modal={type:'drawer'};
  const title=type==='close'?'جرد الدرج في آخر اليوم':'جرد الدرج الصبح';
  showModal(sheetHtml('🧮 '+title,`<div id="drawBody"><form class="form" id="drawform"><div class="hint">اختياري. عُد الفلوس اللي في الدرج واكتب المبلغ.</div>${field('الفلوس اللي في الدرج دلوقتي (ج)','<input id="dr-amt" type="number" inputmode="decimal" step="any" min="0" required>')}${field('ملاحظة (اختياري)','<input id="dr-note">')}<button class="btn" type="submit">سجّل الجرد</button><button class="btn soft" type="button" data-act="draw-skip">${opt.home?'تخطي ← الرئيسية':'تخطي'}</button></form></div>`));
  $('#drawform').addEventListener('submit',async e=>{e.preventDefault();
    const counted=num($('#dr-amt').value); const exp=expectedDrawer();
    const rec={id:uid(),date:today(),ts:Date.now(),type,counted,expected:exp==null?null:Math.round(exp*100)/100,diff:exp==null?null:Math.round((counted-exp)*100)/100,note:$('#dr-note').value.trim(),by:byWho()};
    if(!(await ssave('drawer',{items:[...dcounts(),rec]})))return;
    const d=rec.diff;
    $('#drawBody').innerHTML=(d===null?`<div class="drawres neu">📍 اتسجل كبداية للجرد<div class="hint">الجرد الجاي هيتقارن بالمبلغ ده</div></div>`
      :Math.abs(d)<0.5?`<div class="drawres okk">✅ الدرج مظبوط</div>`
      :d>0?`<div class="drawres bad">⚠️ زيادة <span class="num">${fmt(d)}</span> ج</div>`:`<div class="drawres bad">⚠️ ناقص <span class="num">${fmt(-d)}</span> ج</div>`)
      +`<button class="btn" style="width:100%;margin-top:12px" data-act="draw-done" data-home="${opt.home?1:0}">تمام</button>`;
  });
}
function drawerHtml(){

/* ---------- voice report ---------- */
function reportText(){
  const R=range(), created=d=>d.createdAt?iso(new Date(d.createdAt)):d.entryDate;
  const ds=devs(), entered=ds.filter(d=>inR(created(d),R)).length, done=ds.filter(d=>d.status==='done'&&inR(d.deliveredAt,R));
  const revenue=done.reduce((s,d)=>s+num(d.price),0), costs=partsLoggedIn(R);
  const lossP=cache.losses.filter(l=>inR(l.date,R)).reduce((s,l)=>s+num(l.amount),0), expP=cache.expenses.filter(e=>inR(e.date,R)).reduce((s,e)=>s+num(e.amount),0);
  const collected=ds.reduce((s,d)=>s+(d.payments||[]).filter(p=>inR(p.date,R)).reduce((a,p)=>a+num(p.amount),0),0);
  const inspect=ds.filter(d=>d.status==='check').length, partW=ds.filter(d=>d.status==='part').length, readyN=ds.filter(d=>d.status==='ready'||d.status==='hold').length;
  const net=revenue-costs-lossP-expP;
  const L=[`تقرير ${R.label}.`,
    `دخل ${entered} ${entered===1?'جهاز':'جهاز'} واتسلم ${done.length}.`,
    `دلوقتي ${inspect} تحت الفحص، و${partW} مستنيين قطعة، و${readyN} جاهزين للتسليم.`,
    `الإيراد ${fmt(revenue)} جنيه، واتقبض فعليًا ${fmt(collected)} جنيه.`,
    `المصروفات ${fmt(expP)} جنيه، وصافي الربح ${fmt(net)} جنيه.`];
  const trs=transfersAll().filter(t=>inR(t.date,R));
  if(trs.length){
    L.push(`التحويلات في الفترة: ${trs.map(t=>`${t.from} حوّل ل${t.to} ${fmt(t.amount)} جنيه${t.note?' ('+t.note+')':''}`).join('، ')}.`);
    const w=trs.filter(t=>/محفظ|كاش|انستا|إنستا/i.test(t.to)).reduce((s,t)=>s+num(t.amount),0);
    if(w)L.push(`إجمالي التحويل للمحافظ ${fmt(w)} جنيه.`);
  }
  const mem=slist('payroll','members'), mv=slist('payroll','moves').filter(m=>inR(m.date,R));
  if(mv.length){const nm=id=>(mem.find(m=>m.id===id)||{}).name||'';L.push(`حركات المرتبات: ${mv.map(m=>`${nm(m.mid)} ${m.type==='pen'?'اتخصم منه':'سحب'} ${fmt(m.amount)} جنيه`).join('، ')}.`)}
  const dc=dcounts().filter(c=>inR(c.date,R)); if(dc.length){const bad=dc.filter(c=>c.diff!=null&&Math.abs(c.diff)>=0.5);L.push(bad.length?`جرد الدرج فيه فرق ${bad.map(c=>(c.diff>0?'زيادة ':'ناقص ')+fmt(Math.abs(c.diff))).join(' و')} جنيه.`:'جرد الدرج مظبوط.')}
  return L.join('\n');
}
function speak(text){
  if(!window.speechSynthesis){toast('الجهاز ده مش بيدعم القراءة الصوتية، اقرا التقرير من الشاشة');return}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/\n/g,' '));
  const vs=speechSynthesis.getVoices(); u.voice=vs.find(v=>/^ar[-_]EG/i.test(v.lang))||vs.find(v=>/^ar/i.test(v.lang))||null; u.lang=u.voice?u.voice.lang:'ar-EG'; u.rate=.95;
  speechSynthesis.speak(u);
}
function openVoiceReport(){
  S.modal={type:'voice'}; const t=reportText();
  showModal(sheetHtml('🔊 التقرير الصوتي',`<div class="box" style="white-space:pre-wrap;line-height:1.9">${esc(t)}</div><div class="acts"><button class="btn" data-act="vr-play">▶️ اسمع التقرير</button><button class="btn soft" data-act="vr-stop">⏹ وقف</button></div>`));

/* ---------- balance: hide spending breakdown from the team ---------- */
function renderBalance(){
  if(!$('#balance'))return;
  const opening=num(finSettings().opening);
  const collectedAll=devs().reduce((s,d)=>s+paidOf(d),0);
  const partsDirect=devs().reduce((s,d)=>s+(d.parts||[]).filter(p=>!p.fromStock).reduce((a,p)=>a+num(p.price)+num(p.shipping),0),0);
  const stockSpent=cache.inventory.reduce((s,i)=>s+num(i.spent),0);
  const expAll=cache.expenses.reduce((s,e)=>s+num(e.amount),0);
  const lossAll=cache.losses.reduce((s,e)=>s+num(e.amount),0);
  const balance=opening+collectedAll+incomeTotal()-partsDirect-stockSpent-expAll-lossAll;
  const hold={};
  devs().forEach(d=>(d.payments||[]).forEach(p=>{const h=p.holder||DRAWER;hold[h]=(hold[h]||0)+num(p.amount)}));
  const holders=Object.entries(hold).sort((a,b)=>b[1]-a[1]);
  const body=isAdmin?`<div class="rows">
    <div class="row"><span>رصيد بداية</span><span>${money(opening)}</span></div>
    <div class="row"><span>كل اللي اتقبض من العملاء</span><span>${money(collectedAll)}</span></div>
    ${incomeTotal()?`<div class="row"><span>دخل إضافي</span><span class="good">+ ${money(incomeTotal())}</span></div>`:''}
    <div class="row"><span>قطع غيار وشحن لأجهزة</span><span class="crit">− ${money(partsDirect)}</span></div>
    <div class="row"><span>مشتريات مخزون</span><span class="crit">− ${money(stockSpent)}</span></div>
    <div class="row"><span>المصروفات</span><span class="crit">− ${money(expAll)}</span></div>
    <div class="row"><span>خسائر صيانة</span><span class="crit">− ${money(lossAll)}</span></div>
    <div class="row total"><span>الرصيد الحالي</span><span class="${balance>=0?'good':'crit'}">${money(balance)}</span></div></div>`
   :`<div class="rows">
    <div class="row"><span>كل اللي اتقبض من العملاء</span><span>${money(collectedAll)}</span></div>
    <div class="row total"><span>رصيد المكان الحالي</span><span class="${balance>=0?'good':'crit'}">${money(balance)}</span></div></div>`;
  $('#balance').innerHTML=`<div class="box"><h2>رصيد المكان</h2>${body}
    ${holders.length?`<h3 style="margin-top:14px">الفلوس المقبوضة موجودة فين</h3>${holders.map(([h,a])=>`<div class="item"><div class="t"><b>${esc(h)}</b>${h!==DRAWER&&h!==CWALLET?'<div>عهدة عند الشخص ده</div>':''}</div><span class="num">${fmt(a)}</span>${h!==DRAWER&&h!==CWALLET?`<button class="btn sm soft" data-act="handover" data-h="${esc(h)}" data-to="${DRAWER}">للدرج</button><button class="btn sm soft" data-act="handover" data-h="${esc(h)}" data-to="${CWALLET}">لمحفظة المركز</button>`:''}</div>`).join('')}`:''}
   </div>`;
}

/* Override put/patch/remove in Demo mode so all interactions work locally without server errors */
const _origPut=put, _origPatch=patch, _origRemove=remove;
put = async function(col,id,data){
  if(S.demo){ applyRow({collection:col,id,data}); renderData(); return; }
  return _origPut(col,id,data);
};
patch = async function(col,id,data){
  if(S.demo){ const cur=cache[col].find(x=>x.id===id); applyRow({collection:col,id,data:{...stripId(cur),...data}}); renderData(); return; }
  return _origPatch(col,id,data);
};
remove = async function(col,id){
  if(S.demo){ dropRow(col,id); renderData(); return; }
  return _origRemove(col,id);
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  if(act==='set-shape'){
    setPref('shape',b.dataset.shape);
    renderData();
    toast('تم التبديل إلى '+SHAPES[b.dataset.shape].n);
    return;
  }
  if(act==='quick-theme'){
    const r=document.documentElement;
    const isDark=PREFS.mode==='dark'||(PREFS.mode==='auto'&&!!(darkMQ&&darkMQ.matches));
    setPref('mode',isDark?'light':'dark');
    toast(isDark?'☀️ تم تفعيل الوضع النهاري':'🌙 تم تفعيل الوضع الليلي');
    return;
  }
  if(act==='open-appearance'){openAppearanceModal();return;}
  if(act==='about-dev'){openAboutDev();return;}
  if(act==='start-demo'){startDemoMode();return;}
  if(act==='toggle-demo-role'&&S.demo){
    isAdmin=!isAdmin;
    if(!isAdmin&&S.tab==='set')S.tab='devices';
    renderTab();
    updateBrandHeader();
    toast(isAdmin?'👑 تم التبديل لعرض المدير':'👤 تم التبديل لعرض الفني');
    return;
  }
});

const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('i'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const stripId=o=>{const {id,...rest}=o||{};return rest};

/* ---------- http ---------- */
async function http(path,opt){
  const {method='GET',body,auth=true,headers={}}=opt||{};
  const h={apikey:SB_KEY,...headers};
  if(body!==undefined)h['Content-Type']='application/json';
  if(auth){
    const t=await accessToken();
    if(!t){const e=new Error('not signed in');e.code='no_session';throw e}
    h.Authorization='Bearer '+t;
  }
  let res;
  try{ res=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)}); }
  catch(err){ const e=new Error('network: '+((err&&err.message)||'failed to fetch')); e.code='network'; throw e; }
  const text=await res.text(); let json=null; try{ json=text?JSON.parse(text):null }catch(e){}
  if(!res.ok){
    const e=new Error((json&&(json.message||json.msg||json.error_description||json.error))||('HTTP '+res.status));
    e.code=String((json&&(json.error_code||json.code))||res.status); e.status=res.status; throw e;
  }
  return json;
}
function setSession(r){
  if(!r){ session=null; SS.set(null); return; }
  const now=Math.floor(Date.now()/1000);
  session={access_token:r.access_token,refresh_token:r.refresh_token,
    expires_at:r.expires_at||(now+(Number(r.expires_in)||3600)),
    user:(r.user&&{id:r.user.id,email:r.user.email,name:(r.user.user_metadata||{}).name||(session&&session.user&&session.user.name)||''})||(session&&session.user)||{}};
  SS.set(session);
}
async function accessToken(){
  if(!session)return null;
  const now=Math.floor(Date.now()/1000);
  if(session.expires_at&&session.expires_at-now>60)return session.access_token;
  if(!refreshing){
    refreshing=(async()=>{
      try{
        const r=await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:session.refresh_token}});
        setSession(r);
      }catch(e){
        if(e.code!=='network'){ setSession(null); handleSignedOut('انتهت الجلسة، سجّل دخول تاني'); }
        throw e;
      }finally{ refreshing=null; }
    })();
  }
  try{ await refreshing; }catch(e){ if(e.code==='network'&&session&&session.access_token)return session.access_token; return null; }
  return session&&session.access_token;
}

/* ---------- cache ---------- */
function applyRow(r){
  if(!r||!cache[r.collection])return;
  const doc={...(r.data||{}),id:r.id};
  const i=cache[r.collection].findIndex(x=>x.id===r.id);
  if(i<0)cache[r.collection].push(doc); else cache[r.collection][i]=doc;
}
function dropRow(col,id){ if(cache[col])cache[col]=cache[col].filter(x=>x.id!==id); }

/* ---------- writes (same names the app already uses) ---------- */
async function put(col,id,data){
  busy++;
  try{
    await http('/rest/v1/docs?on_conflict=collection,id',{method:'POST',body:{collection:col,id,data},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
    applyRow({collection:col,id,data}); renderData();
  }finally{busy--}
}
async function patch(col,id,data){
  busy++;
  try{
    await http('/rest/v1/rpc/patch_doc',{method:'POST',body:{p_collection:col,p_id:id,p_patch:data}});
    const cur=cache[col].find(x=>x.id===id);
    applyRow({collection:col,id,data:{...stripId(cur),...data}}); renderData();
  }finally{busy--}
}
async function remove(col,id){
  busy++;
  try{
    const rows=await http('/rest/v1/docs?collection=eq.'+encodeURIComponent(col)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=representation'}});
    if(!rows||!rows.length){const e=new Error('not allowed');e.code='42501';throw e}
    dropRow(col,id); renderData();
  }finally{busy--}
}
async function safe(fn){
  try{ await fn(); return true; }
  catch(e){
    const c=e&&e.code, m=String((e&&e.message)||'');
    toast(c==='42501'||c==='401'||c==='403'||/not allowed|row-level/i.test(m)?'مفيش صلاحية للعملية دي على الحساب ده'
      :c==='network'?'مفيش اتصال بالنت، جرب تاني'
      :'الحفظ ماتمش، جرب تاني');
    console.warn(e);
    return false;
  }
}

function priLevel(d){const p=expProfit(d);return p>=priHigh()?'high':p>=priMid()?'mid':'low'}
const PRI_LABEL={high:'أولوية عالية',mid:'أولوية متوسطة',low:'أولوية عادية'};
function renderFbar(){

function filtered(){
  const q=S.q.trim().toLowerCase();
  return devs().filter(d=>{
    if(S.tech&&d.tech!==S.tech)return false;
    if(S.filter==='all'&&d.status==='done'&&!q)return false;
    if(S.filter==='stale'&&!isStale(d))return false;
    if(S.filter!=='all'&&S.filter!=='stale'&&d.status!==S.filter)return false;
    if(!q)return true;
    return [d.customer,d.phone,d.model,d.imei,d.issue,String(d.no||'')].some(x=>String(x||'').toLowerCase().includes(q));
  }).sort((a,b)=>{
    const dn=(a.status==='done')-(b.status==='done'); if(dn)return dn;
    if(S.sort==='prio'){
      const u=(b.urgent?1:0)-(a.urgent?1:0); if(u)return u;
      const pr=expProfit(b)-expProfit(a); if(pr)return pr;
    }
    return (b.createdAt||0)-(a.createdAt||0);
  });
}

    customer:d.customer||'',phone:d.phone||'',model:d.model||'',issue:d.issue||'',entry:d.entryDate||'',delivered:d.deliveredAt||'',
    price,paid,left:price-paid,wtxt};

async function shareReceipt(){
  const d=devs().find(x=>x.id===(S.modal&&S.modal.id)); if(!d)return;
  const r=receiptData(d);
  const lines=[r.center+(r.cphone?' - '+r.cphone:''),'إيصال '+r.no+' - '+dshow(today()),'العميل: '+r.customer,
    r.model?'الجهاز: '+r.model:'',r.issue?'العطل: '+r.issue:'',r.wtxt?'الضمان: '+r.wtxt:'',
    'المبلغ: '+fmt(r.price)+' ج','المدفوع: '+fmt(r.paid)+' ج','المتبقي: '+fmt(Math.max(0,r.left))+' ج','شكرًا لثقتكم'].filter(Boolean);
  const text=lines.join('\n');

function range(){
  const r=S.ref;
  if(S.period==='day')return {from:r,to:r,label:`اليوم ${dshow(r)}`};
  if(S.period==='week'){const back=(parse(r).getDay()+1)%7;const f=addDays(r,-back);const t=addDays(f,6);return {from:f,to:t,label:`الأسبوع من ${dshow(f)} إلى ${dshow(t)}`}}
  const d=parse(r);const f=iso(new Date(d.getFullYear(),d.getMonth(),1));const t=iso(new Date(d.getFullYear(),d.getMonth()+1,0));
  return {from:f,to:t,label:`شهر ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
}

/* ---------- per-field voice input (a mic next to each field) ---------- */
const MIC_SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC_WORDS={'صفر':'0','زيرو':'0','zero':'0','واحد':'1','واحدة':'1','one':'1','اتنين':'2','اثنين':'2','إثنين':'2','two':'2','تلاتة':'3','ثلاثة':'3','تلات':'3','three':'3','اربعة':'4','أربعة':'4','أربع':'4','four':'4','خمسة':'5','خمس':'5','five':'5','ستة':'6','ست':'6','six':'6','سبعة':'7','سبع':'7','seven':'7','تمانية':'8','ثمانية':'8','تمن':'8','eight':'8','تسعة':'9','تسع':'9','nine':'9'};
function micDigits(t){return t.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c))}
function micValue(el,raw){
  let t=micDigits(String(raw||'').trim());
  if(el.type==='tel'||el.type==='number'||el.inputMode==='numeric'||el.inputMode==='decimal'){
    t=t.split(/\s+/).map(w=>{const k=w.toLowerCase();return Object.prototype.hasOwnProperty.call(MIC_WORDS,k)?MIC_WORDS[k]:w}).join(' ');
    t=t.replace(/(?<=\d)\s+(?=\d)/g,'').replace(/[^\d.\-]/g,'');
  }
  return t;
}
let micActive=null;
function stopMic(){ if(micActive){try{micActive.rec.stop()}catch(e){} micActive=null} document.querySelectorAll('.mic.on').forEach(b=>b.classList.remove('on')); }
function startMic(btn){
  const el=btn.previousElementSibling; if(!el||!MIC_SR)return;
  if(micActive&&micActive.btn===btn){stopMic();return}
  stopMic();
  micRun(btn,el,0);
}
/* one recording attempt. On iPhone the very first start can die right after the system permission dialog,
   so if it ends almost instantly with nothing heard (and no real error) it is restarted once, silently. */
function micRun(btn,el,attempt){
  const rec=new MIC_SR(); rec.lang='ar-EG'; rec.interimResults=false; rec.maxAlternatives=1;
  micActive={rec,btn}; btn.classList.add('on');
  const t0=Date.now(); let got=false, err='';
  const mine=()=>micActive&&micActive.rec===rec;
  rec.onresult=ev=>{
    got=true;
    const txt=micValue(el,Array.from(ev.results).map(r=>r[0].transcript).join(' '));
    if(!txt)return;
    el.value=(el.tagName==='TEXTAREA'&&el.value?el.value+' ':'')+txt;
    el.dispatchEvent(new Event('input',{bubbles:true}));
  };
  rec.onerror=ev=>{ err=ev.error||'error'; };
  rec.onend=()=>{
    if(!mine())return;
    const quick=Date.now()-t0<1500;
    if(!got&&quick&&attempt<1&&(!err||err==='aborted'||err==='no-speech')){
      micActive=null; setTimeout(()=>{ if(!micActive&&btn.isConnected&&el.isConnected)micRun(btn,el,attempt+1) },250); return;
    }
    stopMic();
    if(got)return;
    if(err==='not-allowed'||err==='service-not-allowed')toast('المايك مش مسموح. اسمح للموقع باستخدام المايك من إعدادات سفاري (aA ← إعدادات الموقع ← الميكروفون ← سماح)',8000);
    else if(err==='language-not-supported')toast('الموبايل ده مش بيدعم الإملاء بالعربي المصري');
    else if(err==='network')toast('التسجيل الصوتي محتاج اتصال بالنت');
    else toast('مسمعتش حاجة، دوس المايك واتكلم على طول'+(err?' ('+err+')':''));
  };
  try{rec.start()}catch(e){ if(mine())micActive=null; btn.classList.remove('on'); toast('التسجيل مانفعش، جرب تاني ('+((e&&e.name)||'error')+')'); }
}
const MIC_SKIP=new Set(['hidden','checkbox','radio','file','password','date','time','datetime-local','month','week','range','color','button','submit','reset','image','email','url']);
function attachMics(root){
  if(!MIC_SR)return;
  (root||document).querySelectorAll('input,textarea').forEach(el=>{
    if(el.tagName==='INPUT'&&MIC_SKIP.has((el.type||'text').toLowerCase()))return;
    if(el.readOnly||el.disabled||el.hidden||el.closest('.mw'))return;
    const par=el.parentElement; if(!par)return;
    const w=document.createElement('span'); w.className='mw';
    par.insertBefore(w,el); w.appendChild(el);
    const b=document.createElement('button'); b.type='button'; b.className='mic'; b.setAttribute('aria-label','تسجيل صوتي للخانة دي');
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
    w.appendChild(b);
  });
}

  const e=parse(ws); e.setMonth(e.getMonth()+Number(w.months)); return iso(e);
}
const sameCust=(a,b)=>a.id!==b.id&&((digits(a.phone)&&digits(a.phone)===digits(b.phone))||(String(a.customer||'').trim()&&String(a.customer||'').trim()===String(b.customer||'').trim()));
const custDevices=d=>devs().filter(x=>sameCust(d,x));
const loyEvery=()=>{const n=Number(settings().loyEvery);return n>0?n:5};
const sameModel=(a,b)=>String(a.model||'').trim()&&String(a.model||'').trim().toLowerCase()===String(b.model||'').trim().toLowerCase();
function swInfo(p){
  if(!(num(p.sw)>0)||!p.date)return null;
  const end=addDays(p.date,num(p.sw)); return {end,left:Math.floor((parse(end)-parse(today()))/864e5)};
}
function swText(p){
  const i=swInfo(p); if(!i)return '';
  return i.left<0?` · <span class="crit">ضمان التاجر خلص ${dshow(i.end)}</span>`
    :` · ضمان التاجر لحد ${dshow(i.end)}${i.left<=7?` <span class="crit">(باقي ${i.left} يوم)</span>`:''}`;
}
function cashBalance(){
  const opening=num(finSettings().opening);
  const collectedAll=devs().reduce((s,d)=>s+paidOf(d),0);
  const partsDirect=devs().reduce((s,d)=>s+(d.parts||[]).filter(p=>!p.fromStock).reduce((a,p)=>a+num(p.price)+num(p.shipping),0),0);
  const stockSpent=cache.inventory.reduce((s,i)=>s+num(i.spent),0);
  const expAll=cache.expenses.reduce((s,e)=>s+num(e.amount),0);
  const lossAll=cache.losses.reduce((s,e)=>s+num(e.amount),0);
  return opening+collectedAll+incomeTotal()-partsDirect-stockSpent-expAll-lossAll;
}
function monthRangeOf(ref){const d=parse(ref);return {from:iso(new Date(d.getFullYear(),d.getMonth(),1)),to:iso(new Date(d.getFullYear(),d.getMonth()+1,0))}}
const monthLabel=ref=>{const d=parse(ref);return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`};

/* ---------- price comparison across suppliers (from data already entered) ---------- */
/* cheaper-supplier alert: same part already bought/quoted cheaper from another supplier */
function cheaperFor(name,total,sup){
  const n=String(name||'').trim().toLowerCase(); if(!n||!(total>0))return null;
  const me=String(sup||'').trim().toLowerCase(); const rows=[];
  const hit=x=>{const m=String(x||'').trim().toLowerCase(); return m&&(m===n||m.includes(n)||n.includes(m))};
  devs().forEach(d=>(d.parts||[]).forEach(p=>{if(!p.fromStock&&p.supplier&&hit(p.name))rows.push({sup:p.supplier,price:num(p.price)+num(p.shipping)})}));
  cache.inventory.forEach(i=>{if(i.supplier&&hit(i.name+' '+(i.model||'')))rows.push({sup:i.supplier,price:num(i.buyPrice)})});
  slist('quotes','items').forEach(x=>{if(x.sup&&hit(x.name))rows.push({sup:x.sup,price:num(x.price)})});
  const best=rows.filter(r=>r.price>0&&String(r.sup).trim().toLowerCase()!==me&&r.price<total).sort((a,b)=>a.price-b.price)[0];
  return best?`تنبيه: جبت "${String(name).trim()}" قبل كده من ${String(best.sup).trim()} بـ ${fmt(best.price)} ج، وده أقل بـ ${fmt(total-best.price)} ج`:null;
}
function renderCompare(){
  const out=$('#pcres'), inp=$('#pc-q'); if(!out||!inp)return;
  const q=inp.value.trim().toLowerCase();
  if(!q){out.innerHTML='<div class="hint">اكتب اسم القطعة (مثال: شاشة A52) وهيظهر سعرها عند كل تاجر اشتريت منه (شامل الشحن للقطع اللي اتشترت لأجهزة).</div>';return}
  const rows=[];
  devs().forEach(d=>(d.parts||[]).forEach(p=>{if(!p.fromStock&&p.supplier&&String(p.name||'').toLowerCase().includes(q))rows.push({sup:p.supplier.trim(),price:num(p.price)+num(p.shipping),t:p.date||''})}));
  cache.inventory.forEach(i=>{if(i.supplier&&(String(i.name||'')+' '+String(i.model||'')).toLowerCase().includes(q))rows.push({sup:i.supplier.trim(),price:num(i.buyPrice),t:i.createdAt?iso(new Date(i.createdAt)):''})});
  slist('quotes','items').forEach(x=>{if(x.sup&&String(x.name||'').toLowerCase().includes(q))rows.push({sup:String(x.sup).trim(),price:num(x.price),t:x.date||''})});
  const g={}; rows.forEach(r=>{const o=g[r.sup]||(g[r.sup]={sup:r.sup,min:Infinity,last:0,lastT:'',n:0}); o.min=Math.min(o.min,r.price); o.n++; if(!o.lastT||r.t>=o.lastT){o.lastT=r.t;o.last=r.price}});
  const list=Object.values(g).sort((a,b)=>a.min-b.min);
  out.innerHTML=list.length?list.map((o,i)=>`<div class="item"><div class="t"><b>${esc(o.sup)}</b>${i===0&&list.length>1?' <span class="qual">الأرخص</span>':''}<div>أقل سعر ${money(o.min)} · آخر سعر ${money(o.last)} · ${o.n} مرة</div></div></div>`).join(''):'<div class="hint">مفيش تاجر متسجل بالقطعة دي لسه.</div>';
}

/* ---------- technician points: +1 delivered, +1 on time, +1 rating 4-5, -2 same fault returned within 30 days ---------- */
function techPoints(){
  const ds=devs(), done=ds.filter(d=>d.status==='done'&&d.deliveredAt), month=iso(new Date()).slice(0,7), out={};
  const get=k=>out[k]||(out[k]={tech:k,total:0,month:0,n:0,ontime:0,good:0,back:0});
  const add=(k,pts,mon,f)=>{const o=get(k); o.total+=pts; if(mon)o.month+=pts; if(f)o[f]++};
  done.forEach(d=>{
    const k=d.tech; if(!k)return; const mon=String(d.deliveredAt).startsWith(month);
    add(k,1,mon,'n');
    if(d.due&&d.deliveredAt<=d.due)add(k,1,mon,'ontime');
    if(num(d.rating)>=4)add(k,1,mon,'good');
  });
  ds.forEach(d=>{
    if(!d.model)return; const created=d.createdAt?iso(new Date(d.createdAt)):d.entryDate; if(!created)return;
    const prev=done.filter(x=>x.id!==d.id&&sameCust(d,x)&&sameModel(x,d)&&x.deliveredAt<=created&&(parse(created)-parse(x.deliveredAt))/864e5<=30).sort((a,b)=>b.deliveredAt.localeCompare(a.deliveredAt))[0];
    if(prev&&prev.tech)add(prev.tech,-2,String(created).startsWith(month),'back');
  });
  return out;
}
const PTS_RULE='النقاط: +1 لكل جهاز اتسلم، +1 لو اتسلم في معاده، +1 لو تقييم العميل 4 أو 5 نجوم، −2 لو العميل رجّع نفس الجهاز خلال 30 يوم.';
function statsHtml(){
  const ds=devs(), done=ds.filter(d=>d.status==='done'&&d.deliveredAt);
  const rep={};
  ds.forEach(d=>{
    if(!d.model)return; const created=d.createdAt?iso(new Date(d.createdAt)):d.entryDate; if(!created)return;
    const prev=done.filter(x=>x.id!==d.id&&sameCust(d,x)&&sameModel(x,d)&&x.deliveredAt<=created&&(parse(created)-parse(x.deliveredAt))/864e5<=30).sort((a,b)=>b.deliveredAt.localeCompare(a.deliveredAt))[0];
    if(prev&&prev.tech)rep[prev.tech]=(rep[prev.tech]||0)+1;
  });
  const techs={}; done.forEach(d=>{const k=d.tech||'بدون فني'; const o=techs[k]||(techs[k]={n:0,profit:0,rev:0,rs:0,rn:0}); o.n++; o.rev+=num(d.price); o.profit+=num(d.price)-partCost(d); if(d.rating){o.rs+=d.rating;o.rn++}});
  const maxRev=Math.max(1,...Object.values(techs).map(o=>o.rev));
  const tl=Object.entries(techs).sort((a,b)=>b[1].rev-a[1].rev).map(([k,o])=>`<div class="brow"><div class="top2"><b>${esc(k)}</b><span class="num">${fmt(o.rev)} ج</span></div><div class="bar alt"><i style="width:${Math.max(2,Math.round(o.rev/maxRev*100))}%"></i></div><div class="hint" style="margin-top:4px">${o.n} جهاز اتسلم · الربح ${fmt(o.profit)} ج · رجوع بنفس العطل خلال 30 يوم: ${rep[k]||0}${o.rn?` · تقييم ${(o.rs/o.rn).toFixed(1)}★`:''}</div></div>`).join('');
  const pc={}; ds.forEach(d=>(d.parts||[]).forEach(p=>{const k=String(p.name||'').trim().toLowerCase(); if(!k)return; const o=pc[k]||(pc[k]={name:p.name.trim(),n:0,cost:0}); o.n++; o.cost+=num(p.price)+num(p.shipping)}));
  const pl=Object.values(pc).sort((a,b)=>b.n-a.n).slice(0,8).map(o=>`<div class="item"><div class="t"><b>${esc(o.name)}</b></div><span class="num">${o.n} مرة</span></div>`).join('');
  const fc={}; done.forEach(d=>{const k=String(d.issue||'').trim(); if(!k)return; const o=fc[k]||(fc[k]={k,n:0,profit:0}); o.n++; o.profit+=num(d.price)-partCost(d)});
  const fl=Object.values(fc).sort((a,b)=>b.profit-a.profit).slice(0,8).map(o=>`<div class="item"><button class="t" data-act="fault-open" data-k="${esc(String(o.k).toLowerCase())}" style="background:none;border:0;text-align:start;padding:0;cursor:pointer;color:inherit"><b>${esc(o.k)}</b><div>${o.n} مرة · متوسط ${money(o.profit/o.n)}</div><div class="hint">دوس تشوف أكتر الموديلات بالعطل ده</div></button><span class="${o.profit>=0?'good':'crit'}">${money(o.profit)}</span></div>`).join('');
  const mc={}; ds.forEach(d=>{const m=String(d.model||'').trim(), i=String(d.issue||'').trim(); if(!m||!i)return; const o=mc[m.toLowerCase()]||(mc[m.toLowerCase()]={m,n:0,f:{}}); o.n++; o.f[i]=(o.f[i]||0)+1});
  const ml=Object.values(mc).filter(o=>o.n>=2).sort((a,b)=>b.n-a.n).slice(0,8).map(o=>{const top=Object.entries(o.f).sort((a,b)=>b[1]-a[1])[0]; return `<div class="item"><div class="t"><b>${esc(o.m)}</b><div>الأكتر: ${esc(top[0])} (${top[1]} من ${o.n})</div></div></div>`}).join('');
  const ptArr=Object.values(techPoints()).sort((a,b)=>b.month-a.month||b.total-a.total);
  const maxPt=Math.max(1,...ptArr.map(o=>Math.max(o.month,0)));
  const pt=ptArr.map((o,i)=>`<div class="brow"><div class="top2"><b>${o.month>0&&i<3?['🏆 ','🥈 ','🥉 '][i]:''}${esc(o.tech)}</b><span class="num good">${o.month}</span></div><div class="bar"><i style="width:${Math.max(0,Math.round(o.month/maxPt*100))}%"></i></div><div class="hint" style="margin-top:4px">الشهر ده ${o.month} · الإجمالي ${o.total} · في المعاد ${o.ontime} · تقييم عالي ${o.good} · رجوع ${o.back}</div></div>`).join('');
  const blk=(t,h,e)=>`<h3 style="margin-top:12px">${t}</h3>${h||`<div class="hint">${e}</div>`}`;
  return secBox('stats','الإحصائيات',`${blk('نقاط الفنيين',pt,'لسه مفيش أجهزة اتسلمت.')}<div class="hint">${PTS_RULE}</div>${blk('أداء كل فني',tl,'لسه مفيش أجهزة اتسلمت.')}${blk('أكتر القطع استهلاكًا',pl,'لسه مفيش قطع متسجلة على أجهزة.')}${blk('الأعطال الأعلى ربحًا',fl,'لسه مفيش أجهزة اتسلمت بعطل مكتوب.')}${blk('العطل الأكتر لكل موديل',ml,'محتاج على الأقل جهازين من نفس الموديل.')}<div class="hint" style="margin-top:10px">الأعطال بتتجمع بنفس النص المكتوب، فاكتب العطل بنفس الصيغة كل مرة (مثال: "شاشة" مش مرة "شاشة" ومرة "تغيير شاشة").</div>`);
}

function vxFind(T,re){
  const starts=[],parts=[]; let pos=0;
  T.forEach(t=>{const x=t.used?'§':t.n; starts.push(pos); parts.push(x); pos+=x.length+1});
  const s=parts.join(' '), m=re.exec(s); if(!m)return null;
  const off=m.index+m[1].length, end=off+m[2].length;
  const i0=starts.indexOf(off); if(i0<0)return null;
  let i1=i0; while(i1<T.length-1&&starts[i1]+parts[i1].length<end)i1++;
  return {i0,i1,text:m[2]};
}
function vxTok(text){
  const t=vxDig(text).replace(/[،,؛;؟?!:"«»()\[\]]+/g,' ').replace(/\.(?=\s|$)/g,' ').replace(/\s+/g,' ').trim();
  if(!t)return [];
  return t.split(' ').map(w=>({w,n:vxN(w),used:false}));
}
/* understands free speech: phone, price, delivery time, device model, fault, customer name, notes */
function parseVoice(text){
  const T=vxTok(text), out={}; if(!T.length)return out;
  const mark=(a,b)=>{for(let i=a;i<=b;i++)T[i].used=true};
  const words=idx=>idx.map(i=>T[i].w).join(' ');
  const free=i=>i>=0&&i<T.length&&!T[i].used;

  /* 1. phone: a run of digit tokens (or spoken digit words) that looks like a phone number */
  const isD=t=>/^\+?\d+$/.test(t.n)||VX_DIGW[t.n]!==undefined;
  const dv=t=>/^\+?\d+$/.test(t.n)?t.n.replace('+',''):String(VX_DIGW[t.n]);
  for(let i=0;i<T.length&&!out.phone;i++){
    if(T[i].used||!isD(T[i]))continue;
    let j=i,s=''; while(j<T.length&&!T[j].used&&isD(T[j])){s+=dv(T[j]);j++}
    s=s.replace(/^00/,''); if(/^20\d{10}$/.test(s))s='0'+s.slice(2);
    let p=''; const m=s.match(/01[0125]\d{8}/);
    if(m)p=m[0]; else if(/^0\d{8,10}$/.test(s))p=s; else if(/^1[0125]\d{8}$/.test(s))p='0'+s;
    if(p){out.phone=p; mark(i,j-1); let k=i-1; while(free(k)&&vxHas(VX_PHONEMARK,T[k].n)){T[k].used=true;k--}}
    i=j-1;
  }
  /* 2. price */
  for(const re of VX_PRICE_RES){
    const r=vxFind(T,re); if(!r)continue;
    const d=r.text.match(/\d+/); let amt=d?Number(d[0]):0;
    if(!d)r.text.split(' ').forEach(w=>{if(VX_WNUM[w])amt=VX_WNUM[w]});
    if(amt>0){out.price=amt; mark(r.i0,r.i1); break}
  }
  /* 3. delivery time */
  const rd=vxFind(T,VX_DUE_RE);
  if(rd){out.due=words(Array.from({length:rd.i1-rd.i0+1},(_,k)=>rd.i0+k)); mark(rd.i0,rd.i1); let k=rd.i0-1; while(free(k)&&vxHas(VX_DUEMARK,T[k].n)){T[k].used=true;k--}}

  /* 4. explicit labels ("الموديل ..."، "العطل ..."، "ملاحظات ...") still work */
  const labs=[];
  for(let i=0;i<T.length;i++){
    if(T[i].used)continue;
    const two=i+1<T.length&&!T[i+1].used?VX_LAB2.find(p=>p[0]===T[i].n+' '+T[i+1].n):null;
    if(two){labs.push({i,len:2,f:two[1]});i++;continue}
    const f=VX_LAB1.get(T[i].n); if(f)labs.push({i,len:1,f});
  }
  labs.forEach((L,li)=>{
    const end=li+1<labs.length?labs[li+1].i:T.length;
    mark(L.i,L.i+L.len-1);
    if(L.f==='phone'||out[L.f])return;
    const idx=[]; for(let i=L.i+L.len;i<end;i++){ if(!T[i].used)idx.push(i) }
    let take=idx;
    if(L.f==='customer'){take=[]; for(const i of idx){ const t=T[i]; if(take.length>=3||vxHas(VX_FILL,t.n)||vxHas(VX_BRAND,t.n)||vxFault(t)||/\d/.test(t.n)||vxHas(VX_CUSTMARK,t.n))break; take.push(i)}}
    if(take.length){out[L.f]=words(take); take.forEach(i=>T[i].used=true)}
  });

  /* 5. notes: everything after "وفيه / وفيها / ملاحظات..." */
  if(!out.notes){
    const k=T.findIndex(t=>!t.used&&VX_NOTESTART.has(t.n));
    if(k>=0){
      const idx=[]; for(let i=k;i<T.length;i++){ if(!T[i].used)idx.push(i) }
      const skip=/^(ملاحظات|ملاحظه|لاحظت)$/.test(T[k].n);
      const body=idx.map((i,q)=>q===0?(skip?'':T[i].w.replace(/^و/,'')):T[i].w).filter(Boolean).join(' ');
      if(body){out.notes=body}
      idx.forEach(i=>T[i].used=true);
    }
  }

  /* 6. device model: a known brand + the model words after it, or a latin model code like A52 */
  if(!out.model){
    let bi=-1;
    for(let i=0;i<T.length;i++){ if(free(i)&&vxHas(VX_BRAND,T[i].n)){bi=i;break} }
    if(bi<0){ for(let i=0;i<T.length;i++){ if(free(i)&&/^(?:[a-z]+\d+[a-z+]*|\d+[a-z]+)$/.test(T[i].n)){bi=i;break} } }
    if(bi>=0){
      const idx=[bi], parts=[vxFix(T[bi].w)]; let j=bi+1;
      while(free(j)&&parts.length<7&&!vxFault(T[j])&&!vxHas(VX_CUSTMARK,T[j].n)&&!vxHas(VX_BRAND,T[j].n)){
        const n=T[j].n;
        if(VX_LETTERS.has(n)&&free(j+1)&&/^\d/.test(T[j+1].n)){parts.push(VX_LETTERS.get(n)+T[j+1].w);idx.push(j,j+1);j+=2;continue}
        if(/^[a-z0-9+\-]+$/.test(n)||vxHas(VX_MODELW,n)){parts.push(vxFix(T[j].w));idx.push(j);j++;continue}
        break;
      }
      out.model=parts.join(' '); idx.forEach(i=>T[i].used=true);
    }
  }

  /* 7. fault: from the first fault word to the end of that phrase */
  if(!out.issue){
    const s=T.findIndex(t=>!t.used&&vxFault(t));
    if(s>=0){
      const idx=[s]; let j=s+1;
      while(free(j)&&!vxHas(VX_BRAND,T[j].n)&&!vxHas(VX_CUSTMARK,T[j].n)&&!vxHas(VX_ISSUESTOP,T[j].n)){idx.push(j);j++}
      out.issue=words(idx); idx.forEach(i=>T[i].used=true);
    }
  }

  /* 8. customer name: after a marker ("اسمه"، "العميل"، "بتاع"، "الحاج") or the first free words that look like a name */
  if(!out.customer){
    const stopName=i=>!free(i)||vxHas(VX_FILL,T[i].n)||vxHas(VX_BRAND,T[i].n)||vxFault(T[i])||/\d/.test(T[i].n)||vxHas(VX_CUSTMARK,T[i].n);
    let found=null;
    for(let i=0;i<T.length&&!found;i++){
      if(!free(i)||!vxHas(VX_CUSTMARK,T[i].n))continue;
      let k=i; const heads=[]; while(free(k)&&vxHas(VX_CUSTMARK,T[k].n)){heads.push(k);k++}
      const nm=[]; while(nm.length<3&&k<T.length&&!stopName(k)){nm.push(k);k++}
      if(nm.length)found={heads,nm};
    }
    if(found){
      const keep=found.heads.filter(i=>vxHas(VX_TITLE,T[i].n));
      out.customer=words([...keep,...found.nm]); found.heads.concat(found.nm).forEach(i=>T[i].used=true);
    }else{
      let k=0; while(k<T.length&&stopName(k))k++;
      const nm=[]; while(nm.length<3&&k<T.length&&!stopName(k)){nm.push(k);k++}
      if(nm.length){out.customer=words(nm); nm.forEach(i=>T[i].used=true)}
    }
  }

  /* 9. anything left over goes to the notes so nothing you said is lost */
  const left=T.filter(t=>!t.used&&!vxHas(VX_FILL,t.n)&&!vxHas(VX_CUSTMARK,t.n)).map(t=>t.w);
  if(left.length)out.notes=((out.notes?out.notes+' ':'')+left.join(' ')).trim();
  return out;
}

/* ----- voice recording + follow-up questions ----- */
const VX_IDS={customer:'f-customer',phone:'f-phone',model:'f-model',issue:'f-issue',notes:'f-notes',due:'f-due',price:'f-price'};
const VX_NAMES={customer:'العميل',phone:'التليفون',model:'الجهاز',issue:'العطل',due:'التسليم',price:'السعر',notes:'ملاحظات'};
const VQ_ASK=[['customer','اسم العميل إيه؟'],['phone','رقم التليفون كام؟'],['model','نوع الجهاز إيه؟ (مثال: سامسونج A52)'],['issue','العطل إيه؟'],['due','ميعاد التسليم إمتى؟']];
let voiceRec=null, vq=null;
function vqNext(){
  const box=$('#vq'); if(!box||!$('#devform')){vq=null;return}
  while(vq&&vq.i<VQ_ASK.length){const el=$('#'+VX_IDS[VQ_ASK[vq.i][0]]); if(el&&!el.value.trim())break; vq.i++}
  if(!vq||vq.i>=VQ_ASK.length){vq=null; box.innerHTML='<div class="hint good">تمام، الخانات الأساسية اتملت. راجعها وسجّل الجهاز.</div>'; return}
  const a=VQ_ASK[vq.i], left=VQ_ASK.length-vq.i;
  box.innerHTML=`<div class="box" style="margin:0"><div class="hint">باقي ${left} من الأسئلة</div><div style="font-weight:600;margin:4px 0 8px">${esc(a[1])}</div><div class="tools"><input class="search" id="vq-in" autocomplete="off" placeholder="اكتب الإجابة أو دوس المايك"><button class="btn soft sm" type="button" data-act="vq-mic">🎤</button></div><div class="acts"><button class="btn sm" type="button" data-act="vq-ok">تمام</button><button class="btn ghost sm" type="button" data-act="vq-skip">تخطي</button><button class="btn ghost sm" type="button" data-act="vq-stop">كفاية أسئلة</button></div></div>`;
  if(vq.auto)setTimeout(()=>{if(vq&&vq.auto&&$('#devform')&&!voiceRec)vqListen()},500);
}
function vqApply(text){
  if(!vq)return false;
  const a=VQ_ASK[vq.i], k=a[0]; text=String(text||'').trim();
  if(!text){toast('مسمعتش حاجة، جرب تاني'); return false}
  const p=parseVoice(text); let v=p[k];
  if(k==='phone'){ if(!v){toast('مفهمتش الرقم، اكتبه أو قوله تاني'); return false} }
  else if(!v)v=text;
  const el=$('#'+VX_IDS[k]); if(el)el.value=v;
  vq.i++; vqNext(); return true;
}
function vqListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('المتصفح ده مش بيدعم التسجيل الصوتي، اكتب الإجابة'); return}
  if(voiceRec){try{voiceRec.stop()}catch(e){} return}
  const rec=new SR(); voiceRec=rec; let buf='';
  rec.lang='ar-EG'; rec.continuous=false; rec.interimResults=false; rec.maxAlternatives=1;
  const mic=$('[data-act="vq-mic"]'); if(mic)mic.textContent='⏹ بسمعك...';
  rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)buf+=' '+ev.results[i][0].transcript}};
  rec.onerror=ev=>{if(vq)vq.auto=false; toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'اسمح للمتصفح باستخدام المايك':ev.error==='no-speech'?'مسمعتش حاجة، جرب تاني':'التسجيل مانفعش، جرب تاني')};
  rec.onend=()=>{
    voiceRec=null; const m=$('[data-act="vq-mic"]'); if(m)m.textContent='🎤';
    if(!vq||!$('#devform'))return;
    if(buf.trim()){vq.auto=true; if(!vqApply(buf))vq.auto=false} else vq.auto=false;
  };
  try{rec.start()}catch(e){voiceRec=null; if(mic)mic.textContent='🎤'; toast('التسجيل مانفعش، جرب تاني')}
}
function voiceFill(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('المتصفح ده مش بيدعم التسجيل الصوتي، استخدم كروم');return}
  if(voiceRec){try{voiceRec.stop()}catch(e){} return}
  vq=null; const vqBox=$('#vq'); if(vqBox)vqBox.innerHTML='';
  const rec=new SR(); voiceRec=rec; let buf='';
  rec.lang='ar-EG'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=1;
  const label='🎤 سجّل بالصوت', hint=$('#vhint');
  btn.textContent='⏹ بسمعك... دوس لما تخلص'; btn.classList.add('danger');
  rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)buf+=' '+ev.results[i][0].transcript}};
  rec.onerror=ev=>{toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'اسمح للمتصفح باستخدام المايك':ev.error==='no-speech'?'مسمعتش حاجة، جرب تاني':'التسجيل مانفعش، جرب تاني')};
  rec.onend=()=>{
    voiceRec=null; btn.textContent=label; btn.classList.remove('danger');
    const text=buf.trim(); if(!text||!$('#devform'))return;
    const p=parseVoice(text), shown=[];
    Object.keys(p).forEach(k=>{const el=$('#'+VX_IDS[k]); if(!el)return; el.value=p[k]; shown.push(VX_NAMES[k]+': '+p[k])});
    if(hint)hint.innerHTML='سمعتك: «'+esc(text)+'»<br>فهمت: '+(shown.length?esc(shown.join(' · ')):'<b class="crit">مفهمتش حاجة محددة</b>')+'<br>راجع الخانات وصحّح لو فيه غلط.';
    vq={i:0,auto:false}; vqNext();
  };
  try{rec.start()}catch(e){voiceRec=null;btn.textContent=label;btn.classList.remove('danger');toast('التسجيل مانفعش، جرب تاني')}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const a=b.dataset.act;
  if(a==='voice-fill')voiceFill(b);
  else if(a==='vq-mic')vqListen();
  else if(a==='vq-ok'){const i=$('#vq-in'); if(i)vqApply(i.value)}
  else if(a==='vq-skip'){if(vq){vq.i++; vq.auto=false; vqNext()}}
  else if(a==='vq-stop'){vq=null; if(voiceRec){try{voiceRec.stop()}catch(x){}} const bx=$('#vq'); if(bx)bx.innerHTML=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='vq-in'){e.preventDefault(); vqApply(e.target.value)}});

/* ----- sign-up screen ----- */
function showSignup(msg){

  L.innerHTML=`<div class="loginwrap"><div class="box"><div class="brand" style="margin-bottom:4px">${LOGO}تسجيل جديد</div><div class="muted" style="margin-bottom:14px">اكتب بياناتك، والأدمن هيوافق على حسابك قبل ما تقدر تدخل.</div>
   <form class="form" id="signform" autocomplete="on">

    ${field('الباسورد (6 على الأقل)','<input id="s-pass" type="password" name="password" autocomplete="new-password" dir="ltr" minlength="6" required>')}
    <div id="signerr" class="hint crit" role="alert">${esc(msg||'')}</div>

async function doSignup(e){
  e.preventDefault();
  const btn=$('#signbtn'), err=$('#signerr'); err.textContent='';
  const name=$('#s-name').value.trim(), email=$('#s-email').value.trim().toLowerCase(), password=$('#s-pass').value;
  if(!name||!email||password.length<6){err.textContent='اكتب الاسم والإيميل وباسورد 6 حروف على الأقل';return}
  btn.disabled=true; btn.textContent='جاري الإرسال...';
  try{
    const r=await http('/auth/v1/signup',{method:'POST',auth:false,body:{email,password,data:{name}}});
    if(r&&r.access_token){ setSession(r); session.user.name=name; SS.set(session); await startApp(); return; }
    showLogin('اتعمل الحساب. لو وصلك إيميل تأكيد أكده الأول، وبعدها سجّل دخول وطلبك هيروح للأدمن.');
  }catch(ex){
    btn.disabled=false; btn.textContent='إرسال طلب التسجيل';
    err.textContent=ex.code==='network'?'مفيش اتصال بالنت':(/already|registered/i.test(ex.message||'')||ex.code==='user_already_exists')?'الإيميل ده مسجل قبل كده، جرّب تسجيل الدخول':(ex.code==='weak_password'?'الباسورد ضعيف، اختار أقوى':'حصلت مشكلة ('+(ex.message||ex.code)+')');
  }
}
/* ----- approval gate ----- */
async function memberStatus(create){
  const uid=session&&session.user&&session.user.id; if(!uid)return 'ok';
  let rows;
  try{ rows=await http('/rest/v1/docs?collection=eq.members&id=eq.'+encodeURIComponent(uid)+'&select=data'); }
  catch(e){ return 'ok'; }
  const m=rows&&rows[0]&&rows[0].data;
  if(!m){
    if(!create)return 'removed';
    const email=session.user.email||'', name=session.user.name||email.split('@')[0]||'';
    /* the request must really be saved, otherwise the admin never sees it: report a failure instead of pretending it was sent */
    try{ await http('/rest/v1/docs?on_conflict=collection,id',{method:'POST',body:{collection:'members',id:uid,data:{email,name,approved:false,createdAt:Date.now()}},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}}); }
    catch(e){ console.warn(e); memberStatus.lastErr=(e&&(e.code||e.message))||'error'; return e&&e.code==='network'?'neterr':'error'; }
    return 'pending';
  }
  if(m.disabled)return 'disabled';
  return m.approved?'ok':'pending';
}

    removed:['الحساب مش موجود','الحساب ده اتحذف أو لسه مش متسجل. سجّل خروج وجرّب تسجّل من جديد.'],
    neterr:['مفيش اتصال بالنت','مقدرتش أبعت طلب التسجيل للأدمن. اتأكد من النت ودوس "تحديث".'],
    error:['طلبك ماوصلش للأدمن','حصلت مشكلة وطلب التسجيل ماتسجلش، فالأدمن مش هيشوفه. بلّغ الأدمن بالرسالة دي: '+esc(String(memberStatus.lastErr||''))]}[st]||['مش مسموح','كلّم الأدمن.'];
  L.innerHTML=`<div class="loginwrap"><div class="box"><div class="brand" style="margin-bottom:8px">${LOGO}${t[0]}</div><div class="muted" style="margin-bottom:14px">${t[1]}</div>

   <button class="btn soft" type="button" data-act="logout" style="margin-top:8px">تسجيل خروج</button></div></div>`;

const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const credKey=()=>'rc_cred_'+((session&&session.user&&session.user.id)||'');
const myCred=()=>{try{return localStorage.getItem(credKey())||''}catch(e){return ''}};
function myMemberName(){const uid=session&&session.user&&session.user.id; const m=cache.members.find(x=>x.id===uid); return (m&&m.name)||(session&&session.user&&(session.user.name||session.user.email))||'—'}
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0}):rej({code:0}))}
async function fpRegister(){
  if(!window.PublicKeyCredential||!navigator.credentials){toast('المتصفح ده مش بيدعم البصمة. افتح الرابط من Chrome أو Safari على HTTPS');return false}
  const uid=session.user.id;
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'متابعة المركز',id:location.hostname},
      user:{id:new TextEncoder().encode(uid).slice(0,64),name:session.user.email||uid,displayName:myMemberName()},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    const id=b64u(cred.rawId);
    try{localStorage.setItem(credKey(),id)}catch(e){}
    const cur=cache.creds.find(x=>x.id===uid); const ids=[...new Set([...(cur&&cur.ids||[]),id])];
    await safe(()=>put('creds',uid,{ids,updatedAt:Date.now()}));
    toast('تم تفعيل البصمة على الموبايل ده'); return true;
  }catch(e){ toast(e&&e.name==='NotAllowedError'?'اتلغى تفعيل البصمة':'مقدرتش أفعّل البصمة. اتأكد إن الموبايل عليه بصمة أو قفل شاشة والصفحة على HTTPS',6000); return false }
}
async function fpVerify(){
  const id=myCred(); if(!id)throw {nofp:true};
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64u(id)}],userVerification:'required',timeout:60000}});
}
function lastAtt(uid){return cache.attendance.filter(r=>r.uid===uid).sort((a,b)=>b.ts-a.ts)[0]}
function nextKind(uid){
  const l=lastAtt(uid);
  if(l&&l.kind==='in'&&Date.now()-l.ts<18*36e5)return 'out';
  const t=today();
  return cache.attendance.some(r=>r.uid===uid&&r.date===t&&r.kind==='in')?'done':'in';
}
function askPassword(){
  return new Promise(res=>{
    const w=document.createElement('div');
    w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    w.innerHTML='<form class="box" style="width:100%;max-width:360px;margin:0"><h2>تأكيد بكلمة السر</h2><div class="hint" style="margin-bottom:8px">اكتب كلمة سر حسابك في التطبيق.</div><input id="pw-in" type="password" autocomplete="current-password" style="width:100%" required><div class="acts" style="margin-top:10px"><button class="btn" type="submit">تأكيد</button><button class="btn soft" type="button" id="pw-x">إلغاء</button></div></form>';
    document.body.appendChild(w);
    const done=v=>{w.remove();res(v)};
    w.querySelector('#pw-x').onclick=()=>done(null);
    w.querySelector('form').onsubmit=e=>{e.preventDefault();done(w.querySelector('#pw-in').value)};
    setTimeout(()=>{try{w.querySelector('#pw-in').focus()}catch(e){}},50);
  });
}
async function pwVerify(){
  const pw=await askPassword(); if(pw===null)throw {cancel:true};
  const email=session&&session.user&&session.user.email;
  try{await http('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password:pw}})}
  catch(e){throw {badpw:true}}
}
async function attAct(btn){
  const s=attSet(), usePw=btn.dataset.mode==='pw'||!myCred();
  if(!s.lat||!s.lng){toast('الأدمن لسه ما حددش موقع المركز');return}
  const uid=session.user.id, kind=nextKind(uid);
  if(kind==='done'){toast('سجّلت حضورك وانصرافك النهاردة. مفيش تسجيل تاني في نفس اليوم',5000);return}
  btn.disabled=true; const old=btn.textContent; btn.textContent='جاري تحديد موقعك...';
  try{
    let pos; try{pos=await getPos()}catch(e){toast(e&&e.code===1?'اسمح للمتصفح بالوصول للموقع':'مقدرتش أحدد موقعك، اتأكد إن الـ GPS شغال وجرب تاني',6000);return}
    const d=distM(pos.coords.latitude,pos.coords.longitude,Number(s.lat),Number(s.lng)), rad=Number(s.radius)||100;
    if(d>rad){toast('إنت بعيد عن المركز بحوالي '+Math.round(d)+' متر. لازم تكون جوه '+rad+' متر',7000);return}
    if(usePw){
      try{await pwVerify()}catch(e){if(!(e&&e.cancel))toast('كلمة السر غلط',5000);return}
    }else{
      btn.textContent='أكّد بالبصمة...';
      try{await fpVerify()}catch(e){toast('البصمة ماتأكدتش. تقدر تسجّل بكلمة السر بدلها',6000);return}
    }
    const now=Date.now();
    if(await safe(()=>put('attendance',newId(),{uid,name:myMemberName(),kind,ts:now,date:iso(new Date(now)),lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0),dist:Math.round(d),fp:usePw?0:1,pw:usePw?1:0})))toast(kind==='in'?'اتسجل حضورك '+hm(now):'اتسجل انصرافك '+hm(now),5000);
  }finally{btn.disabled=false;btn.textContent=old}
}
function attSummary(uid,month){
  const recs=cache.attendance.filter(r=>r.uid===uid&&String(r.date).startsWith(month)).sort((a,b)=>a.ts-b.ts);
  let ms=0,open=null; const days=new Set();
  recs.forEach(r=>{ if(r.kind==='in'){open=r.ts;days.add(r.date)} else if(open){ms+=r.ts-open;open=null;days.add(r.date)} });
  return {days:days.size,hours:ms/36e5,open:!!open};
}
const hrs=h=>{const m=Math.round(h*60);return Math.floor(m/60)+' س '+pad(m%60)+' د'};

}

function rangeOf(p,r){
  if(p==='day')return {from:r,to:r};
  if(p==='week'){const back=(parse(r).getDay()+1)%7;const f=addDays(r,-back);return {from:f,to:addDays(f,6)}}
  return monthRangeOf(r);
}

/* ----- clickable summary groups ----- */
const GROUPS={in:'أجهزة دخلت النهاردة',out:'اتسلم النهاردة',open:'لسه شغالين عليها',wait:'في الانتظار',check:'جاري الفحص',part:'مستنية قطعة غيار',ready:'جاهزة للتسليم',stale:'متأخرة من غير تحديث'};
const NEXT={wait:['check','ابدأ الفحص'],check:['ready','تم الإصلاح ← جاهز للتسليم'],part:['check','وصلت القطعة ← جاري الفحص']};
function groupDevs(k){
  const ds=devs(), t=today(), created=d=>d.createdAt?iso(new Date(d.createdAt)):d.entryDate;
  if(k==='in')return ds.filter(d=>created(d)===t);
  if(k==='out')return ds.filter(d=>d.status==='done'&&d.deliveredAt===t);
  if(k==='open')return ds.filter(d=>d.status!=='done');
  if(k==='ready')return ds.filter(d=>d.status==='ready'||d.status==='hold');
  if(k==='stale')return ds.filter(isStale);
  if(k==='wait'||k==='check'||k==='part')return ds.filter(d=>d.status===k);
  return [];
}
function openGroup(k){
  S.modal={type:'group',k};
  showModal(sheetHtml(esc(GROUPS[k]||''),'<div id="grpList"></div>'));
  refreshGroup();
}

   <div class="gs">${pay}${warr}${d.addedBy?' · سجّله '+esc(d.addedBy):''}</div>
   ${parts?`<div class="gs">القطع: ${parts}</div>`:''}
   <div class="ga">${nxt}${other}<button class="btn sm ghost" data-act="open-dev" data-id="${id}">فتح الجهاز</button></div>
   <details data-id="${id}"><summary>+ إضافة قطعة غيار</summary><div class="form" style="margin-top:8px">
     <div class="g2">${field('اسم القطعة',`<input id="gp-name-${id}" placeholder="شاشة / آي سي">`)}${field('التكلفة (ج)',`<input id="gp-price-${id}" type="number" inputmode="decimal" step="any" min="0">`)}</div>
     ${field('التاجر (اختياري)',`<input id="gp-sup-${id}" list="dl-suppliers">`)}
     <button class="btn soft sm" type="button" data-act="grp-part" data-id="${id}">إضافة القطعة</button></div></details></div>`;
}
function refreshGroup(){
  const box=$('#grpList'); if(!box||!S.modal||S.modal.type!=='group')return;
  const ae=document.activeElement;
  if(ae&&box.contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
  const typed={}, opened=new Set();
  box.querySelectorAll('input[id]').forEach(i=>{if(i.value)typed[i.id]=i.value});
  box.querySelectorAll('details[open]').forEach(d=>opened.add(d.dataset.id));
  const list=groupDevs(S.modal.k).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||(b.createdAt||0)-(a.createdAt||0));
  box.innerHTML=list.length?`<div class="hint" style="margin-bottom:6px">${devicesWord(list.length)}</div>`+list.map(grpRow).join(''):'<div class="empty" style="border:0"><b>مفيش أجهزة هنا دلوقتي</b></div>';
  box.querySelectorAll('details').forEach(d=>{if(opened.has(d.dataset.id))d.open=true});
  Object.entries(typed).forEach(([k,v])=>{const el=document.getElementById(k); if(el)el.value=v});
  attachMics(box);
}
function openFault(key){
  const ds=devs().filter(d=>String(d.issue||'').trim().toLowerCase()===key);
  const name=(ds[0]&&String(ds[0].issue).trim())||key;
  const m={}; ds.forEach(d=>{const k=String(d.model||'').trim()||'موديل غير مكتوب'; const o=m[k.toLowerCase()]||(m[k.toLowerCase()]={k,n:0}); o.n++});
  const arr=Object.values(m).sort((a,b)=>b.n-a.n), mx=Math.max(1,...arr.map(o=>o.n));
  S.modal={type:'fault'};
  showModal(sheetHtml(esc(name),`<div class="box"><div class="hint" style="margin-bottom:6px">أكتر الموديلات اللي دخلت بالعطل ده (${devicesWord(ds.length)})</div>${arr.map(o=>`<div class="brow"><div class="top2"><b>${esc(o.k)}</b><span class="num">${o.n} مرة</span></div><div class="bar"><i style="width:${Math.max(2,Math.round(o.n/mx*100))}%"></i></div></div>`).join('')}</div>`));
}
document.addEventListener('click',async e=>{
  const pf=e.target.closest('[data-pref]'); if(pf){setPref(pf.dataset.pref,pf.dataset.v);return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='grp')return openGroup(b.dataset.k);
  if(a==='fault-open')return openFault(b.dataset.k);
  if(a==='grp-move'){
    const dv=devs().find(x=>x.id===id); if(!dv)return;
    const k=b.dataset.k; if(k===dv.status)return;
    await devPatch(dv.id,{status:k,statusAt:Date.now(),deliveredAt:'',statusBy:byWho()}); return;
  }
  if(a==='grp-part'){
    const dv=devs().find(x=>x.id===id); if(!dv)return;
    const nm=document.getElementById('gp-name-'+id), pr=document.getElementById('gp-price-'+id), sp=document.getElementById('gp-sup-'+id);
    const name=nm.value.trim(); if(!name){toast('اكتب اسم القطعة');return}
    const part={id:'p'+Date.now().toString(36),name,supplier:sp.value.trim(),price:num(pr.value),shipping:0,date:today(),by:byWho()};
    const warn=cheaperFor(part.name,part.price,part.supplier);
    const bk=[nm.value,pr.value,sp.value]; nm.value=''; pr.value=''; sp.value='';
    const ok=await devPatch(dv.id,{parts:[...(dv.parts||[]),part]});
    if(!ok){nm.value=bk[0];pr.value=bk[1];sp.value=bk[2]} else toast(warn||'اتضافت القطعة على الجهاز',warn?8000:0);
    return;
  }
});


boot();
})();
</script>

</body></html>
